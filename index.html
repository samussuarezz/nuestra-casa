/* ---------- Revisión entre todos ----------
   Cuando alguien termina una tarea, los demás la califican con una carita.
   Los puntos cuentan cuando al menos 2 de los demás dicen "Bien hecha".
   Las tareas hechas antes de esta función cuentan solas. */
const REVIEW_SINCE = '2026-10-03T16:20:00Z';
const VOTES = {
  ok:  {emo:'👍', label:'Bien hecha', tone:'mint'},
  meh: {emo:'🤏', label:'Le faltó algo', tone:'sun'},
  bad: {emo:'👎', label:'Mal hecha', tone:'red'},
};
function reviewState(t){
  if(!t.doneAt || t.doneAt < REVIEW_SINCE) return {status:'ok', legacy:true, need:0, oks:0, nos:0, revs:[], others:[]};
  const others = S.members.filter(m => m.id !== t.doneBy);
  const need = Math.min(2, others.length);
  const revs = others.map(m => { const r = t['rv_' + m.id]; return r && VOTES[r.v] ? {m, v:r.v, c:String(r.c || '').slice(0, 200), at:r.at} : null; }).filter(Boolean);
  const oks = revs.filter(r => r.v === 'ok').length, nos = revs.length - oks;
  const status = oks >= need ? 'ok' : nos > others.length - need ? 'no' : 'wait';
  return {status, legacy:false, need, oks, nos, revs, others};
}
const afterReset = t => !S.pointsSince || String(t.doneAt || '') >= S.pointsSince;
const rvClear = t => Object.fromEntries(Object.keys(t).filter(k => k.startsWith('rv_')).map(k => [k, null]));
function toReview(){
  if(!S.me) return [];
  const since = Date.now() - 14 * 864e5;
  return S.done.filter(t => t.doneBy && t.doneBy !== S.me && !t['rv_' + S.me] && Date.parse(t.doneAt) > since && afterReset(t) && reviewState(t).status === 'wait')
    .sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
}

function scoresFor(wid){
  const acc = {};
  S.members.forEach(m => acc[m.id] = {pts:0, count:0, pend:0});
  for(const t of S.done){
    if(!t.doneAt || weekIdOf(t.doneAt) !== wid || !afterReset(t)) continue;
    const a = acc[t.doneBy];
    if(!a) continue;
    const st = reviewState(t).status;
    if(st === 'ok'){ a.pts += Number(t.points) || 0; a.count++; }
    else if(st === 'wait') a.pend += Number(t.points) || 0;
  }
  return S.members.map(m => ({m, ...acc[m.id]}))
    .sort((a, b) => b.pts - a.pts || b.count - a.count || a.m.name.localeCompare(b.m.name, 'es'));
}
const winnersOf = sc => { const top = sc[0]?.pts || 0; return top > 0 ? sc.filter(s => s.pts === top) : []; };
const rankOf = (sc, s) => 1 + sc.filter(x => x.pts > s.pts).length;

/* =========================================================
   Datos: Supabase (funciones casa_*) + copia local en memoria
   La app lee siempre de la copia local (rápida y funciona sin
   internet) y la mantiene al día con casa_sync.
   ========================================================= */
const SUPA_URL = 'https://pbwvbvwmlizdzptrhbhu.supabase.co';
const SUPA_KEY = 'sb_publishable_UakHdGxooPOl-JRaswj_jg_DMQMN0rq';
let CODE = null;

function createMemoryDB(){
  const docs = new Map();
  const listeners = new Set();
  let n = 0, queued = false;
  const genId = () => 'm' + Date.now().toString(36) + (n++).toString(36) + rid();
  const notify = () => { if(queued) return; queued = true; queueMicrotask(() => { queued = false; listeners.forEach(l => l.fire()); }); };
  const clone = v => JSON.parse(JSON.stringify(v));
  const meta = {fromCache:false, hasPendingWrites:false};
  const snapDoc = path => { const d = docs.get(path); return {id: path.split('/').pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: meta}; };
  const cmp = (a, op, v) => {
    switch(op){
      case '==': return a === v; case '!=': return a !== v;
      case '>=': return a != null && a >= v; case '>': return a != null && a > v;
      case '<=': return a != null && a <= v; case '<': return a != null && a < v;
      case 'in': return v.includes(a); default: return true;
    }
  };
  function docRef(path){
    return {
      id: path.split('/').pop(), path,
      async get(){ return snapDoc(path); },
      async set(data){ docs.set(path, clone(data)); notify(); },
      async update(data){ if(!docs.has(path)) throw {code:'invalid_argument', message:'missing'}; docs.set(path, {...docs.get(path), ...clone(data)}); notify(); },
      async delete(){ docs.delete(path); notify(); },
      onSnapshot(next){ const l = {fire: () => next(snapDoc(path))}; listeners.add(l); queueMicrotask(l.fire); return () => listeners.delete(l); },
      collection(sub){ return collRef(path + '/' + sub); },
    };
  }
  function query(coll, filters = [], order = null, lim = null){
    const run = () => {
      let out = [];
      for(const [p, d] of docs){ const i = p.lastIndexOf('/'); if(p.slice(0, i) === coll) out.push({id: p.slice(i + 1), d}); }
      out = out.filter(({d}) => filters.every(([f, op, v]) => cmp(d[f], op, v)));
      if(order){ const [f, dir] = order; out.sort((a, b) => { const x = a.d[f], y = b.d[f]; if(x === y) return 0; if(x == null) return 1; if(y == null) return -1; return (x < y ? -1 : 1) * (dir === 'desc' ? -1 : 1); }); }
      else out.sort((a, b) => a.id < b.id ? -1 : 1);
      if(lim) out = out.slice(0, lim);
      const ds = out.map(({id, d}) => ({id, exists:true, data: () => clone(d), metadata: meta}));
      return {docs: ds, size: ds.length, empty: !ds.length, docChanges: () => [], metadata: meta};
    };
    return {
      where(f, op, v){ return query(coll, [...filters, [f, op, v]], order, lim); },
      orderBy(f, dir = 'asc'){ return query(coll, filters, [f, dir], lim); },
      limit(k){ return query(coll, filters, order, k); },
      async get(){ return run(); },
      onSnapshot(next){ const l = {fire: () => next(run())}; listeners.add(l); queueMicrotask(l.fire); return () => listeners.delete(l); },
    };
  }
  function collRef(path){
    return Object.assign(query(path), {
      path,
      doc(id){ return docRef(path + '/' + (id || genId())); },
      async add(data){ const r = docRef(path + '/' + genId()); await r.set(data); return r; },
    });
  }
  return {
    doc: docRef, collection: collRef,
    // Reemplaza todo (carga completa) conservando lo que aún se está guardando
    _load(entries, keep){
      const kept = new Map();
      keep.forEach(p => { if(docs.has(p)) kept.set(p, docs.get(p)); });
      docs.clear();
      for(const [p, d] of entries) if(d) docs.set(p, d);
      kept.forEach((d, p) => docs.set(p, d));
      notify();
    },
    // Aplica cambios sueltos (null = borrado)
    _apply(entries, keep){
      for(const [p, d] of entries){ if(keep.has(p)) continue; if(d) docs.set(p, d); else docs.delete(p); }
      if(entries.length) notify();
    },
    _dump(){ return [...docs.entries()]; },
    _raw(p){ return docs.has(p) ? clone(docs.get(p)) : null; },
    _put(p, d){ if(d) docs.set(p, d); else docs.delete(p); notify(); },
  };
}

/* Llamada a una función casa_* de Supabase */
async function rpc(fn, args){
  let res;
  try {
    res = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
      method:'POST',
      headers:{'apikey': SUPA_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify(args),
    });
  } catch(e){ throw {code:'unavailable', message:'sin conexión'}; }
  const txt = await res.text();
  const body = txt ? (() => { try { return JSON.parse(txt); } catch { return txt; } })() : null;
  if(!res.ok){
    const m = (body && body.message) || '';
    if(m.includes('codigo_invalido')) throw {code:'bad_code', message:m};
    if(m.includes('no_existe') || m.includes('datos_invalidos')) throw {code:'invalid_argument', message:m};
    if(m.includes('casa_llena')) throw {code:'quota_exceeded', message:m};
    if(res.status >= 500 || res.status === 429) throw {code:'unavailable', message:m || res.statusText};
    throw {code:'invalid_argument', message:m || res.statusText};
  }
  return body;
}

/* La base que usa la app: escribe en la copia local y en Supabase */
function createSupaDB(){
  const mem = createMemoryDB();
  const pending = new Map();
  const mark = (p, d) => { const v = (pending.get(p) || 0) + d; v > 0 ? pending.set(p, v) : pending.delete(p); };
  // Cambia la copia local al instante y la guarda en Supabase; si falla, la deshace
  async function remote(fn, path, data, prev){
    const i = path.lastIndexOf('/');
    const args = {p_code: CODE, p_collection: path.slice(0, i), p_id: path.slice(i + 1)};
    if(data !== undefined) args.p_data = data;
    mark(path, 1);
    try { await rpc(fn, args); }
    catch(e){
      if(!pending.has(path) || pending.get(path) === 1) mem._put(path, prev);
      if(e.code === 'bad_code') lostCode(); else if(e.code !== 'unavailable') syncNow(true);
      throw e;
    }
    finally { mark(path, -1); saveCacheSoon(); }
  }
  const wrapDoc = ref => ({
    id: ref.id, path: ref.path,
    get: ref.get, onSnapshot: ref.onSnapshot, collection: ref.collection,
    async set(d){ const prev = mem._raw(ref.path); await ref.set(d); await remote('casa_set', ref.path, d, prev); },
    async update(d){ const prev = mem._raw(ref.path); await ref.update(d); await remote('casa_update', ref.path, d, prev); },
    async delete(){ const prev = mem._raw(ref.path); await ref.delete(); await remote('casa_delete', ref.path, undefined, prev); },
  });
  return {
    mem, pending,
    doc: p => wrapDoc(mem.doc(p)),
    collection(p){
      const c = mem.collection(p);
      return Object.assign({}, c, {
        doc: id => wrapDoc(c.doc(id)),
        async add(d){ const r = wrapDoc(c.doc()); await r.set(d); return r; },
      });
    },
  };
}

/* ---------- Sincronización ---------- */
const SYNC = {cursor:null, running:false, again:false, full:false, timer:0, ok:false};
function cacheKey(){ return 'casa.cache.' + slug(CODE || ''); }
function loadCache(){
  try {
    const raw = localStorage.getItem(cacheKey());
    if(!raw) return false;
    const c = JSON.parse(raw);
    if(!c || !Array.isArray(c.docs)) return false;
    DB.mem._load(c.docs, new Set());
    SYNC.cursor = c.cursor || null;
    return c.docs.length > 0;
  } catch { return false; }
}
let cacheTimer = 0;
function saveCacheSoon(){
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try { localStorage.setItem(cacheKey(), JSON.stringify({cursor: SYNC.cursor, docs: DB.mem._dump()})); } catch {}
  }, 800);
}
function scheduleSync(){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncNow(), 250); }
async function syncNow(full){
  if(!DB || !CODE) return false;
  if(full) SYNC.full = true;
  if(SYNC.running){ SYNC.again = true; return false; }
  SYNC.running = true;
  let ok = false;
  try {
    do {
      SYNC.again = false;
      const doFull = SYNC.full || !SYNC.cursor;
      const cutoff = addDays(weekStart(new Date()), -7 * 8).toISOString();
      const res = await rpc('casa_sync', {p_code: CODE, p_since: doFull ? null : SYNC.cursor, p_cutoff: cutoff});
      if(doFull) SYNC.full = false;
      const list = (res && Array.isArray(res.docs)) ? res.docs : [];
      const entries = list.map(d => [d.c + '/' + d.id, d.x ? null : d.d]);
      if(doFull) DB.mem._load(entries, new Set(DB.pending.keys()));
      else DB.mem._apply(entries, DB.pending);
      SYNC.cursor = res.now;
    } while(SYNC.again);
    ok = true;
    SYNC.ok = true;
    setOnline(true);
    saveCacheSoon();
  } catch(e){
    if(e && e.code === 'bad_code') lostCode();
    else setOnline(false);
  } finally {
    SYNC.running = false;
  }
  return ok;
}
function setOnline(v){ if(S.online !== v){ S.online = v; render(); } }

/* ---------- Tiempo real (Supabase Realtime, protocolo 1.0.0) ---------- */
const RT = {ws:null, hb:0, ref:0, retry:0, topic:null, stop:false};
function startRealtime(topic){
  RT.topic = topic; RT.stop = false;
  if(RT.ws) return;
  rtConnect();
}
function rtConnect(){
  if(RT.stop || !RT.topic) return;
  let ws;
  try { ws = new WebSocket(SUPA_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SUPA_KEY) + '&vsn=1.0.0'); }
  catch { return rtRetry(); }
  RT.ws = ws;
  const send = m => { try { ws.readyState === 1 && ws.send(JSON.stringify(m)); } catch {} };
  ws.onopen = () => {
    RT.retry = 0;
    const r = String(++RT.ref);
    send({topic: 'realtime:' + RT.topic, event: 'phx_join', payload: {config: {broadcast: {ack:false, self:false}, presence: {enabled:false}, postgres_changes: [], private:false}}, ref: r, join_ref: r});
    clearInterval(RT.hb);
    RT.hb = setInterval(() => send({topic:'phoenix', event:'heartbeat', payload:{}, ref: String(++RT.ref)}), 25000);
  };
  ws.onmessage = ev => {
    if(typeof ev.data !== 'string'){ scheduleSync(); return; }
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if(m.event === 'broadcast') scheduleSync();
    else if(m.event === 'phx_reply' && m.topic !== 'phoenix' && m.payload && m.payload.status === 'ok') scheduleSync();
    else if(m.event === 'phx_error' || m.event === 'phx_close'){ try { ws.close(); } catch {} }
  };
  ws.onerror = () => {};
  ws.onclose = () => { clearInterval(RT.hb); if(RT.ws === ws) RT.ws = null; rtRetry(); };
}
function rtRetry(){
  if(RT.stop) return;
  const wait = Math.min(30000, 1000 * Math.pow(2, RT.retry++));
  setTimeout(() => { if(!RT.ws) rtConnect(); }, wait);
}
function stopRealtime(){ RT.stop = true; clearInterval(RT.hb); try { RT.ws && RT.ws.close(); } catch {} RT.ws = null; }

/* ---------- Entrar a la casa con el código ---------- */
function readCodeFromUrl(){
  const h = (location.hash || '').slice(1);
  const m = h.match(/^(?:k|codigo)=(.+)$/);
  if(!m) return null;
  return decodeURIComponent(m[1]).trim().toLowerCase();
}
const normCode = c => String(c || '').trim().toLowerCase().replace(/\s+/g, '');

async function startWithCode(code, interactive){
  code = normCode(code);
  if(!code) return 'empty';
  let info = null, offline = false;
  try { info = await rpc('casa_open', {p_code: code}); }
  catch(e){
    if(e.code === 'unavailable' && lsGet('casa.code') === code && lsGet('casa.topic')){ offline = true; info = {topic: lsGet('casa.topic'), name: lsGet('casa.name') || 'Nuestra Casa'}; }
    else return e.code === 'unavailable' ? 'offline' : 'bad';
  }
  if(!info || !info.topic){
    if(!interactive && lsGet('casa.code') === code) lostCode();
    return 'bad';
  }
  CODE = code;
  lsSet('casa.code', code); lsSet('casa.topic', info.topic); lsSet('casa.name', info.name || 'Nuestra Casa');
  S.needCode = false;
  DB = createSupaDB();
  const hadCache = loadCache();
  if(hadCache){ S.synced = true; subscribe(); }
  render();
  const ok = offline ? false : await syncNow(!hadCache);
  if(!hadCache){ S.synced = true; subscribe(); }
  if(!ok) setOnline(false);
  startRealtime(info.topic);
  return 'ok';
}

function lostCode(){
  stopRealtime();
  try { localStorage.removeItem(cacheKey()); } catch {}
  lsSet('casa.code', null); lsSet('casa.topic', null);
  CODE = null; DB = null; S.synced = false; S.configLoaded = false; S.subscribed = false;
  S.needCode = true; S.codeError = 'Ese código ya no abre ninguna casa. Pídele el código nuevo a quien maneja la app.';
  S.mounted = null;
  render();
}

async function write(fn){
  if(!DB){ toast('Primero entra a tu casa con el código.', {tone:'sun'}); return false; }
  try { await fn(); return true; }
  catch(e){
    let err = e;
    if(err?.code === 'unavailable'){
      await sleep(500 + Math.random() * 700);
      try { await fn(); return true; } catch(e2){ err = e2; }
    }
    const c = err?.code;
    const msg = c === 'unavailable' ? 'Sin conexión: no se pudo guardar. Revisa el internet e intenta de nuevo.'
      : c === 'quota_exceeded' ? 'Se llenó el espacio de la casa. Vacía el carrito o borra tareas viejas.'
      : c === 'bad_code' ? 'El código de la casa cambió. Vuelve a entrar con el código nuevo.'
      : 'No se pudo guardar. Intenta de nuevo.';
    toast(msg, {tone:'red'});
    console.warn('[casa] write failed', err);
    return false;
  }
}

function onSubError(e){ console.warn('[casa] subscription', e); }

function subscribe(){
  if(S.subscribed) return;
  S.subscribed = true;
  DB.doc('config/house').onSnapshot(s => {
    S.configLoaded = true;
    if(s.exists){
      const d = s.data() || {};
      S.configExists = true;
      S.pointsSince = typeof d.pointsSince === 'string' ? d.pointsSince : '';
      S.planView = d.planView === 'iso' ? 'iso' : 'top';
      const wd = Number(d.weekDay);
      WEEK_DAY = Number.isInteger(wd) && wd >= 0 && wd <= 6 ? wd : 1;
      S.members = (Array.isArray(d.members) ? d.members : []).filter(m => m && m.id && m.name).map(m => ({id:String(m.id), name:String(m.name).slice(0, 24), color:safeColor(m.color), emoji:m.emoji ? String(m.emoji).slice(0, 8) : ''}));
      S.rooms = Array.isArray(d.rooms) && d.rooms.length ? d.rooms.filter(r => r && r.id && r.name).map(r => ({id:String(r.id), name:String(r.name).slice(0, 24), emoji:String(r.emoji || '📍').slice(0, 8), color:safeColor(r.color), w:[1,2,3,4].includes(r.w) ? r.w : 2, h:r.h === 2 ? 2 : 1, ...roomGeo(r)})) : DEFAULT_ROOMS;
    } else {
      S.configExists = false;
      S.members = [];
      S.rooms = DEFAULT_ROOMS;
    }
    render();
  }, onSubError);

  DB.collection('tasks').where('done', '==', false).onSnapshot(s => {
    S.pending = s.docs.map(d => ({id: d.id, ...d.data()}));
    S.pendingLoaded = true;
    render();
  }, onSubError);

  const cutoff = addDays(weekStart(new Date()), -7 * 8).toISOString();
  DB.collection('tasks').where('doneAt', '>=', cutoff).onSnapshot(s => {
    const prev = S.doneLoaded ? new Map(S.done.map(t => [t.id, t])) : null;
    S.done = s.docs.map(d => ({id: d.id, ...d.data()})).filter(t => t.done);
    if(prev){ announceDone(S.done.filter(t => !prev.has(t.id))); announceReviews(prev); }
    S.doneLoaded = true;
    render();
  }, onSubError);

  DB.collection('groceries').onSnapshot(s => {
    S.groceries = s.docs.map(d => ({id: d.id, ...d.data()}));
    S.gLoaded = true;
    render();
  }, onSubError);

  DB.collection('weeks').onSnapshot(s => {
    const w = {};
    s.docs.forEach(d => w[d.id] = d.data());
    S.weeks = w;
    render();
  }, onSubError);

  DB.collection('catalog').orderBy('lastAdded', 'desc').limit(120).onSnapshot(s => {
    S.catalog = s.docs.map(d => ({id: d.id, ...d.data()}));
    const map = {};
    S.catalog.forEach(c => { if(c.cat) map[c.id] = c.cat; });
    S.catalogMap = map;
    render();
  }, onSubError);
}

/* Cuando otra persona termina una tarea, se celebra en todos los celulares */
function announceDone(list){
  const fresh = list.filter(t => t.doneBy && t.doneBy !== S.me && Date.now() - Date.parse(t.doneAt || 0) < 5 * 60e3);
  if(!fresh.length || !S.me) return;
  for(const t of fresh.slice(0, 2)){
    const m = memberById(t.doneBy); if(!m) continue;
    toast(`${m.name} hizo «${t.title}». ¿Quedó bien?`, {tone:m.color, action:{label:'Calificar', fn: () => openReviewSheet(t.id)}});
  }
  if(!document.hidden) setTimeout(() => burst(innerWidth / 2, 90, memberById(fresh[0].doneBy)?.color), 120);
}

/* Avisos para quien hizo la tarea cuando los demás la califican */
function announceReviews(prev){
  if(!S.me) return;
  for(const t of S.done){
    if(t.doneBy !== S.me) continue;
    const old = prev.get(t.id); if(!old) continue;
    const before = reviewState(old), now = reviewState(t);
    for(const r of now.revs){
      const o = old['rv_' + r.m.id];
      if(o && o.v === r.v && (o.c || '') === r.c) continue;
      if(Date.now() - Date.parse(r.at || 0) > 5 * 60e3) continue;
      toast(`${r.m.name} calificó «${t.title}»: ${VOTES[r.v].emo} ${VOTES[r.v].label}${r.c ? ` · "${r.c.slice(0, 60)}"` : ''}`, {tone:VOTES[r.v].tone, action:{label:'Ver', fn: () => openReviewSheet(t.id)}});
    }
    if(before.status !== 'ok' && now.status === 'ok'){
      toast(`¡Aprobada! +${Number(t.points) || 0} pts por «${t.title}»`, {tone:'mint', ms:4200});
      if(!document.hidden) setTimeout(() => burst(innerWidth / 2, 90, meM()?.color), 150);
    } else if(before.status !== 'no' && now.status === 'no'){
      toast(`«${t.title}» no fue aprobada. Revisa los comentarios.`, {tone:'red', action:{label:'Ver', fn: () => openReviewSheet(t.id)}});
    }
  }
}

async function boot(){
  if('serviceWorker' in navigator && location.protocol === 'https:'){

  }
  const fromUrl = readCodeFromUrl();
  if(fromUrl){ history.replaceState(null, '', location.pathname + location.search); }
  const code = fromUrl || lsGet('casa.code');
  if(!code){ S.needCode = true; render(); return; }
  S.booting = true; render();

  if(r !== 'ok'){
    S.needCode = true;
    if(r === 'offline') S.codeError = 'Sin conexión. Conéctate a internet para entrar la primera vez.';
    else if(r === 'bad') S.codeError = fromUrl ? 'Ese link trae un código que no abre ninguna casa. Revisa el código.' : S.codeError;
  }
  render();
  setInterval(() => { if(DB && !document.hidden) syncNow(); }, 30000);

/* Cambio de sección: desliza hacia el lado de la pestaña (View Transitions donde exista) */
const TAB_ORDER = ['inicio', 'tareas', 'ranking', 'mercado'];
const canVT = typeof document.startViewTransition === 'function';
if(canVT) document.documentElement.classList.add('vt');
function switchTab(t){
  const dir = TAB_ORDER.indexOf(t) >= TAB_ORDER.indexOf(S.tab) ? 'fwd' : 'back';
  const root = document.documentElement;
  root.dataset.dir = dir;
  const go = () => { S.tab = t; doRender(); window.scrollTo({top:0}); };
  if(canVT && !reduceMotion() && !document.hidden){
    try {
      const vt = document.startViewTransition(go);
      vt.finished.finally(() => { if(root.dataset.dir === dir) delete root.dataset.dir; });
      return;
    } catch {}
  }
  go();
  setTimeout(() => { if(root.dataset.dir === dir) delete root.dataset.dir; }, 450);
}

/* La barra de estado del iPhone (y Android) toma el color de lo que hay detrás */
const hexRGB = h => { h = String(h || '').trim().replace('#', ''); if(h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h.slice(0, 6), 16); return isNaN(n) ? null : [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixHex = (a, b, p) => { const x = hexRGB(a), y = hexRGB(b); if(!x || !y) return b; return '#' + x.map((v, i) => Math.round(v * p + y[i] * (1 - p)).toString(16).padStart(2, '0')).join(''); };
let chromeKey = '';
function syncChrome(){
  const cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue('--bg').trim() || '#F3F0FA';
  const tone = cs.getPropertyValue('--c-' + safeColor(meM()?.color || 'grape')).trim();
  const heroTop = mixHex(tone, bg, .24);
  let top = bg;
  if(sheetState) top = mixHex('#140F28', top, .42);
  const key = heroTop + top;
  if(key === chromeKey) return;
  chromeKey = key;
  document.documentElement.style.setProperty('--hero-top', heroTop);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = top; });
}
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { chromeKey = ''; syncChrome(); });

/* Pantalla de apertura: se queda mínimo ~1 s y se va cuando la casa está lista */

const splashDone = new Promise(r => { splashResolve = r; });
document.body.classList.add('splashing');
function hideSplash(){
  if(splashGone) return;
  splashGone = true;

    document.body.classList.remove('splashing');
    splashResolve();
    if(!sp) return;
    sp.classList.add('out');
    setTimeout(() => sp.remove(), 650);

  const wait = reduceMotion() ? 0 : Math.max(0, 1150 - performance.now());
  setTimeout(go, wait);
}

const sortPending = (a, b) => {
  const da = a.due || '9999', dbb = b.due || '9999';
  if(da !== dbb) return da < dbb ? -1 : 1;
  const ma = a.assignee === S.me ? 0 : 1, mb = b.assignee === S.me ? 0 : 1;
  if(ma !== mb) return ma - mb;
  return (Number(b.points) || 0) - (Number(a.points) || 0) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
};

function skeleton(n = 3, h = 74){ return Array.from({length:n}, () => `<div class="skel" style="height:${h}px"></div>`).join(''); }

   Vistas
   ========================================================= */
/* ---------- Casa isométrica (Inicio y Plano) ---------- */
const ISO_U = 6, ISO_C = Math.cos(Math.PI / 6) * ISO_U, ISO_S = .5 * ISO_U;
const isoP = (x, y, z = 0) => [(x - y) * ISO_C, (x + y) * ISO_S - z * ISO_U];
const isoPts = ps => ps.map(p => isoP(...p).map(v => v.toFixed(1)).join(',')).join(' ');
const isoPoly = (cls, ...ps) => `<polygon class="${cls}" points="${isoPts(ps)}"/>`;
const setHTML = (el, html) => { if(el && el.dataset.html !== html){ el.innerHTML = html; el.dataset.html = html; return true; } return false; };

function roomStats(){
  const counts = {}, lates = {};
  for(const t of S.pending){ counts[t.room] = (counts[t.room] || 0) + 1; if(dueInfo(t.due).bucket === 'late') lates[t.room] = true; }
  return {counts, lates};
}

/* Distribución de los lugares en el plano (unidades ~ 40 cm).
   Cada lugar puede traer `plan: [x, y, ancho, fondo]` o `shape: [[x, y], …]` (contorno recto, p. ej. una L),
   `at: [x, y]` para el nombre y `short` como nombre corto en el plano. Si no trae nada usa PLAN_DEFAULT. */
const PLAN_DEFAULT = {sala:[0,0,10,10], cocina:[11,0,10,10], comedor:[22,0,10,10], habitaciones:[0,11,10,10], banos:[11,11,10,10], lavadero:[22,11,10,10], patio:[0,22,32,7]};
const isNum = v => v !== null && v !== '' && v !== true && v !== false && isFinite(v);
const validPt = p => Array.isArray(p) && p.length === 2 && p.every(isNum);
const validShape = sh => Array.isArray(sh) && sh.length >= 4 && sh.length <= 24 && sh.every(validPt);
function roomGeo(r){
  const g = {};
  if(Array.isArray(r.plan) && r.plan.length === 4 && r.plan.every(isNum)) g.plan = r.plan.map(Number);
  if(validShape(r.shape)) g.shape = r.shape.map(p => [Number(p[0]), Number(p[1])]);
  if(validPt(r.at)) g.at = [Number(r.at[0]), Number(r.at[1])];
  if(typeof r.short === 'string' && r.short.trim()) g.short = r.short.trim().slice(0, 16);
  return g;
}
const rectPts = (x, y, w, d) => [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
function planLayout(rooms){
  const out = [], free = [];
  let maxX = 0, maxY = 0;
  for(const r of rooms){
    let pts = null;
    if(validShape(r.shape)) pts = r.shape;
    else { const p = Array.isArray(r.plan) && r.plan.length === 4 && r.plan.every(isNum) ? r.plan.map(Number) : PLAN_DEFAULT[r.id]; if(p) pts = rectPts(...p); }
    if(pts){ out.push({r, pts}); pts.forEach(([x, y]) => { maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }); }
    else free.push(r);
  }
  const W = Math.max(maxX, 21), cols = W >= 30 ? 3 : 2, cw = (W - (cols - 1)) / cols;
  free.forEach((r, i) => out.push({r, pts: rectPts((i % cols) * (cw + 1), maxY + (maxY ? 1 : 0) + Math.floor(i / cols) * 11, cw, 10)}));
  return out.map(c => {
    const xs = c.pts.map(p => p[0]), ys = c.pts.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const at = validPt(c.r.at) ? c.r.at : [(x0 + x1) / 2, (y0 + y1) / 2];
    return {...c, x0, y0, w: x1 - x0, d: y1 - y0, cx: +at[0], cy: +at[1]};
  });
}
/* Encoge un contorno recto hacia adentro (deja la separación entre pisos) */
const areaOf = pts => pts.reduce((a, p, i) => { const q = pts[(i + 1) % pts.length]; return a + p[0] * q[1] - q[0] * p[1]; }, 0);
function insetOrtho(pts, g){
  const n = pts.length, s = areaOf(pts) > 0 ? 1 : -1;
  const inward = (a, b) => { const dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]); return s > 0 ? [-dy, dx] : [dy, -dx]; };
  return pts.map((p, i) => { const a = inward(pts[(i - 1 + n) % n], p), b = inward(p, pts[(i + 1) % n]); return [p[0] + (a[0] + b[0]) * g, p[1] + (a[1] + b[1]) * g]; });
}

/* Plano isométrico limpio: pisos flotando con su color, un emoji y el nombre */
/* Vista del plano: 'top' (desde arriba, como el dibujo de PC 3051) por defecto; 'iso' (3D) si la casa lo pide en sus datos */
const planView = () => S.planView === 'iso' ? 'iso' : 'top';
function isoHouseSVG(){
  const view = planView(), TOP = view === 'top';
  const TU = 6, TY = .86;
  const P = TOP ? (x, y, z = 0) => [x * TU, y * TU * TY - z * TU * .9] : isoP;
  const poly = (cls, ...ps) => `<polygon class="${cls}" points="${ps.map(p => P(...p).map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  const rooms = S.rooms.length ? S.rooms : DEFAULT_ROOMS;
  const order = TOP ? (a, b) => a.y0 - b.y0 || a.x0 - b.x0 : (a, b) => (a.x0 + a.y0) - (b.x0 + b.y0) || (a.cx + a.cy) - (b.cx + b.cy);
  const cells = planLayout(rooms).sort(order);
  const {counts, lates} = roomStats();
  const G = TOP ? .3 : .5, T = TOP ? .75 : 1.1, f = v => v.toFixed(1);
  const tiles = [], labels = [];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const grow = (px, py) => { x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); };
  cells.forEach((c, i) => {
    const {r} = c, pts = insetOrtho(c.pts, G), n = pts.length, sgn = areaOf(pts) > 0 ? 1 : -1;
    const tone = safeColor(r.color), cnt = counts[r.id] || 0, late = !!lates[r.id];
    let sides = '';
    pts.forEach((a, k) => {
      const b = pts[(k + 1) % n], dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]);
      const out = sgn > 0 ? [dy, -dx] : [-dy, dx];
      if(out[1] === 1 || (!TOP && out[0] === 1)) sides += poly(out[0] === 1 ? 'tl-r' : 'tl-f', [a[0], a[1], 0], [b[0], b[1], 0], [b[0], b[1], -T], [a[0], a[1], -T]);
      grow(...P(a[0], a[1], 0)); grow(...P(a[0], a[1], -T));
    });
    tiles.push(`<g class="iso-tile t-${tone}" style="--i:${i}" data-act="room" data-room="${esc(r.id)}" aria-hidden="true">${sides}${poly('tl-t', ...pts.map(p => [p[0], p[1], 0]))}</g>`);
    const [px, py] = P(c.cx, c.cy, 0);
    const full = r.short || r.name;
    let emoX = px, emoY, lblX = px, lblY, anchor = 'middle', es, ls, name = full, showEmo = true, showLbl = true, bx, by, br;
    if(TOP){
      // desde arriba: el nombre y el emoji se acomodan al tamaño real del lugar
      const sw = (c.w - 2 * G) * TU - 2, sh = (c.d - 2 * G) * TU * TY;
      ls = 6.2; const cw = ls * .58, fit = n => Math.max(3, Math.floor(n / cw));
      if(sh >= 20){
        es = Math.min(10.5, sh * .42);
        if(name.length * cw > sw * 1.4) name = name.slice(0, fit(sw * 1.4) - 1) + '…';
        const tot = es + 2 + ls;
        emoY = py - tot / 2 + es / 2; lblY = emoY + es / 2 + 2 + ls / 2;
      } else {
        es = Math.min(9.5, sh * .8); emoY = py; lblY = py + .3;
        const tw = name.length * cw;
        if(es + 3 + tw <= sw){ emoX = px - (es + 3 + tw) / 2 + es / 2; lblX = emoX + es / 2 + 3; anchor = 'start'; }
        else { showEmo = false; if(tw > sw) name = name.slice(0, fit(sw) - 1) + '…'; }
      }
      const [qx, qy] = P(c.x0 + c.w - G - .25, c.y0 + G + .3, 0);
      bx = qx; by = qy; br = 4.1;
      grow(bx + br, by - br);
      grow(px - name.length * 2, py); grow(px + name.length * 2, py);
    } else {
      const k = Math.min(1, Math.max(.62, Math.min(c.w, c.d) / 6.5));
      es = 21 * k; ls = 10.5 * Math.max(.86, k);
      const maxCh = c.w >= 16 ? 24 : 14;
      if(name.length > maxCh) name = name.slice(0, maxCh - 1) + '…';
      showLbl = Math.min(c.w, c.d) >= 4;
      const off = 13 * Math.max(.8, k); emoY = py - off * .55; lblY = py + off;
      bx = px + 13 * k + 1; by = py - 19 * k; br = 8.5;
      grow(px, py - 30); grow(px - name.length * 3.4, py + 18); grow(px + name.length * 3.4, py + 18);
    }
    labels.push(`<g class="iso-room t-${tone}${cnt ? ' busy' : ''}" style="--i:${i};--d:${(i * .41).toFixed(2)}s" role="button" tabindex="0" data-act="room" data-room="${esc(r.id)}" aria-label="${esc(r.name)}: ${cnt ? plural(cnt, 'tarea pendiente', 'tareas pendientes') + (late ? ', hay vencidas' : '') : 'al día'}">
      ${showEmo ? `<text class="emo" x="${f(emoX)}" y="${f(emoY)}" text-anchor="middle" dominant-baseline="central" style="font-size:${f(es)}px">${esc(r.emoji)}</text>` : ''}
      ${showLbl ? `<text class="lbl" x="${f(lblX)}" y="${f(lblY)}" text-anchor="${anchor}" dominant-baseline="central" style="font-size:${f(ls)}px">${esc(name)}</text>` : ''}
      ${cnt ? `<g class="bdg${late ? ' late' : ''}"><circle class="pin-c" cx="${f(bx)}" cy="${f(by)}" r="${br}"/><text class="pin-t" x="${f(bx)}" y="${f(by + .3)}" text-anchor="middle" dominant-baseline="central"${TOP ? ' style="font-size:5.4px"' : ''}>${cnt > 9 ? '9+' : cnt}</text></g>` : ''}
    </g>`);
  });
  const pad = TOP ? 4 : 8;
  return `<svg class="iso iso-clean${TOP ? ' iso-top' : ''}" viewBox="${f(x0 - pad)} ${f(y0 - pad)} ${f(x1 - x0 + 2 * pad)} ${f(y1 - y0 + 2 * pad)}" role="group" aria-label="Plano de la casa. Toca un lugar para ver sus tareas.">${tiles.join('')}${labels.join('')}</svg>`;
}

function wholeChip(always){
  const nW = roomStats().counts[WHOLE.id] || 0;
  if(!nW && !always) return '';
  return `<button class="whole-chip" data-act="room" data-room="${WHOLE.id}"><span aria-hidden="true">${WHOLE.emoji}</span>${WHOLE.name}<b class="${nW ? '' : 'zero'}">${nW || '✓'}</b></button>`;
}

function flipHTML(el, html){
  if(!el || el.dataset.html === html) return;
  const before = new Map([...el.querySelectorAll('[data-k]')].map(x => [x.dataset.k, x.getBoundingClientRect().top]));
  el.innerHTML = html; el.dataset.html = html;
  if(reduceMotion() || !before.size) return;
  el.querySelectorAll('[data-k]').forEach(x => {
    const b = before.get(x.dataset.k); if(b == null) return;
    const dy = b - x.getBoundingClientRect().top;
    if(Math.abs(dy) > 1 && x.animate) x.animate([{transform:`translateY(${dy}px)`}, {transform:'none'}], {duration:560, easing:'cubic-bezier(.2,.9,.3,1.15)'});
  });
}

function countUp(el, from, to){
  const node = el && el.firstChild;
  if(!node || node.nodeType !== 3) return;
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); node.nodeValue = String(Math.round(from + (to - from) * e)); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

      ${room ? `<div class="roomfilter t-${safeColor(room.color)}"><span>${esc(room.emoji)}</span><span>Solo ${esc(room.name)}</span><button class="mini x" data-act="room-clear" aria-label="Quitar filtro de lugar">${ICON.close}</button></div>` : ''}
    </div>`;

    if(!S.pendingLoaded){ body.innerHTML = `<div class="tasks" style="margin-top:18px">${skeleton(4)}</div>`; return; }

    if(S.taskStatus === 'done'){
      let list = doneWeek;
      if(S.taskWho !== 'all') list = list.filter(t => t.doneBy === S.taskWho);
      if(S.taskRoom) list = list.filter(t => t.room === S.taskRoom);
      list = [...list].sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
      body.innerHTML = list.length
        ? `<div class="group-h t-mint"><span class="dot"></span>Esta semana · ${weekRange(wk)}<span class="n">${list.length}</span></div><div class="tasks">${list.map(t => doneCard(t, true)).join('')}</div>`
        : `<div class="empty t-sun" style="margin-top:18px"><span class="art">🏁</span><h3>Aún no hay tareas hechas</h3><p>Las tareas que se completen esta semana aparecen aquí con quién las hizo.</p></div>`;
      return;
    }

    let list = S.pending;
    if(S.taskWho === 'none') list = list.filter(t => !t.assignee);
    else if(S.taskWho !== 'all') list = list.filter(t => t.assignee === S.taskWho);
    if(S.taskRoom) list = list.filter(t => t.room === S.taskRoom);
    list = [...list].sort(sortPending);
    if(!list.length){
      const any = S.pending.length > 0;
      const chores = CHORES.filter(c => !S.pending.some(t => norm(t.title) === norm(c.t))).slice(0, 6);
      body.innerHTML = `<div class="empty t-mint" style="margin-top:18px"><span class="art">✨</span><h3>${any ? 'Nada con este filtro' : 'La casa está al día'}</h3><p>${any ? 'Prueba con otro filtro o crea una tarea nueva.' : 'Agrega las tareas de la casa. Toca una sugerencia para crearla rápido:'}</p>
        ${any ? '' : `<div class="wrapopts">${chores.map(c => `<button class="pill" data-act="quick-chore" data-t="${esc(c.t)}">${esc(roomById(choreRoom(c)).emoji)} ${esc(c.t)}</button>`).join('')}</div>`}</div>`;
      return;
    }
    const groups = [
      ['late', 'Vencidas', 'red'], ['today', 'Hoy', 'tangerine'], ['tomorrow', 'Mañana', 'sky'],
      ['week', 'Más tarde esta semana', 'grape'], ['later', 'Más adelante', 'gray'], ['none', 'Cuando se pueda', 'gray'],
    ];
    body.innerHTML = groups.map(([b, label, tone]) => {
      const items = list.filter(t => dueInfo(t.due).bucket === b);
      if(!items.length) return '';
      return `<div class="group-h t-${tone}"><span class="dot"></span>${label}<span class="n">${items.length}</span></div><div class="tasks">${items.map(taskCard).join('')}</div>`;
    }).join('');
  },
};

function reviewStatusHTML(t, st){
  const by = memberById(t.doneBy), pts = Number(t.points) || 0;
  if(st.legacy) return `<p class="rv-state t-mint">Se hizo antes de que existieran las revisiones, así que cuenta sola.</p>`;
  if(st.status === 'ok') return `<p class="rv-state t-mint">✓ Aprobada. Los ${pts} pts ya cuentan para ${esc(by?.name || 'quien la hizo')}.</p>`;
  if(st.status === 'no') return `<p class="rv-state t-red">✗ No fue aprobada y no suma puntos. ${esc(by?.name || 'Quien la hizo')} la puede volver a hacer.</p>`;
  return `<p class="rv-state t-sun">En revisión: lleva ${st.oks} de ${st.need} 👍. Los ${pts} pts cuentan al llegar a ${st.need}.</p>`;
}

function openReviewSheet(id, preset){
  const t = S.done.find(x => x.id === id);
  if(!t){ toast('Esa tarea ya no está en la lista.', {tone:'gray', ms:2400}); return; }
  if(needMe()) return;
  const r = roomById(t.room), by = memberById(t.doneBy);
  const st = reviewState(t);
  const mine = t['rv_' + S.me];
  const canVote = !st.legacy && S.me !== t.doneBy && memberById(S.me);
  let v = preset || mine?.v || null;
  const voteBtns = () => Object.entries(VOTES).map(([k, o]) => `<button type="button" class="vote big t-${o.tone}" data-f="v" data-v="${k}" aria-pressed="${v === k}"><span class="ve" aria-hidden="true">${o.emo}</span>${o.label}</button>`).join('');
  openSheet({
    title: canVote ? 'Calificar tarea' : 'Revisión de la tarea',
    body: `<div class="rv-head t-${safeColor(by?.color)}">${avatar(by, 'md')}<span class="rv-txt"><b>${esc(t.title)}</b><span>${esc(by?.name || 'Alguien')} · ${esc(relTime(t.doneAt))} · ${esc(r.emoji)} ${esc(r.name)}</span></span><span class="pts">+${Number(t.points) || 0}</span></div>
      ${reviewStatusHTML(t, st)}
      ${st.revs.length ? `<div class="rv-list">${st.revs.map(x => `<div class="rv-item t-${VOTES[x.v].tone}">${avatar(x.m, 'xs')}<span class="rv-txt"><b>${esc(x.m.name)}${x.m.id === S.me ? ' (tú)' : ''}</b><span>${VOTES[x.v].emo} ${VOTES[x.v].label}</span>${x.c ? `<q>${esc(x.c)}</q>` : ''}</span></div>`).join('')}</div>`
        : st.legacy ? '' : `<p class="note">Nadie la ha calificado todavía.</p>`}
      ${canVote ? `<div class="field"><span class="label">${mine ? 'Tu calificación' : '¿Cómo quedó?'}</span><div class="votes" id="rvVotes">${voteBtns()}</div></div>
        <label class="field"><span class="label">Comentario (opcional)</span><textarea class="input ta" id="rvC" maxlength="200" rows="3" placeholder="Ej: faltó barrer debajo del sofá">${esc(mine?.c || '')}</textarea></label>
        <p class="form-err" id="rvErr" hidden>Escoge una carita.</p>
        <button class="btn-primary" type="button" data-f="send">${mine ? 'Cambiar calificación' : 'Enviar calificación'}</button>` : ''}
      ${S.me === t.doneBy && st.status === 'no' ? `<button class="btn-primary" type="button" data-f="redo">${ICON.undo}Volver a hacerla</button>` : ''}`,
    onMount(sheet){
      sheet.onclick = async e => {
        const b = e.target.closest('[data-f]'); if(!b) return;
        if(b.dataset.f === 'v'){ v = b.dataset.v; $('#rvVotes').innerHTML = voteBtns(); $('#rvErr').hidden = true; return; }
        if(b.dataset.f === 'send'){
          if(!v){ $('#rvErr').hidden = false; return; }
          const c = ($('#rvC').value || '').trim().replace(/\s+/g, ' ').slice(0, 200);
          b.disabled = true;
          const before = reviewState(t).status;
          const ok = await write(() => DB.doc('tasks/' + t.id).update({['rv_' + S.me]: {v, c, at: new Date().toISOString()}}));
          b.disabled = false;
          if(!ok) return;
          closeSheet();
          const now = S.done.find(x => x.id === t.id);
          const after = now ? reviewState(now).status : before;
          if(before !== 'ok' && after === 'ok') toast(`¡Aprobada! ${by?.name || 'Quien la hizo'} gana +${Number(t.points) || 0} pts.`, {tone:'mint', ms:3200});
          else toast(`Calificación enviada: ${VOTES[v].emo} ${VOTES[v].label}`, {tone:VOTES[v].tone, ms:2400});
        }
        if(b.dataset.f === 'redo'){
          const ok = await write(() => DB.doc('tasks/' + t.id).update({done:false, doneBy:null, doneAt:null, ...rvClear(t)}));
          if(ok){ closeSheet(); toast(`«${t.title}» volvió a pendientes. ¡Tú puedes!`, {tone:'sun', ms:3000}); }
        }
      };
    },
  });
}

const VIEWS = {inicio: Inicio, tareas: Tareas, ranking: Ranking, mercado: Mercado};

/* =========================================================
   Acciones
   ========================================================= */
function needMe(){
  if(meM()) return false;
  S.forcePicker = true; render();
  return true;
}

async function completeTask(id, btn){
  if(S.completing.has(id)) return;
  const t = S.pending.find(x => x.id === id);
  if(!t) return;
  if(needMe()) return;
  const me = meM();
  S.completing.add(id);
  const card = btn.closest('.task');
  card?.classList.add('completing');
  const pts = Number(t.points) || DIFFS[t.diff]?.pts || 0;
  const rect = btn.getBoundingClientRect();
  burst(rect.left + rect.width / 2, rect.top + rect.height / 2, me.color);
  floatPts(rect, `+${pts}`, me.color);
  try { navigator.vibrate && navigator.vibrate(18); } catch {}
  await sleep(reduceMotion() ? 50 : 560);
  card?.classList.add('leaving');
  await sleep(reduceMotion() ? 0 : 230);
  const now = new Date().toISOString();
  const ok = await write(() => DB.doc('tasks/' + id).update({done:true, doneBy:S.me, doneAt:now}));
  let nextRef = null;
  if(ok && (t.repeat === 'daily' || t.repeat === 'weekly')){
    const base = t.due ? parseYmd(t.due) : today();
    const from = base > today() ? base : today();
    const next = addDays(from, t.repeat === 'daily' ? 1 : 7);
    nextRef = DB.collection('tasks').doc();
    const r = nextRef;
    const ok2 = await write(() => r.set({title:t.title, room:t.room, diff:t.diff, points:pts, assignee:t.assignee || null, due:ymd(next), repeat:t.repeat, done:false, doneBy:null, doneAt:null, createdBy:t.createdBy || S.me, createdAt:now}));
    if(!ok2) nextRef = null;
  }
  S.completing.delete(id);
  if(!ok){ const it = $('#iToday'); if(it) delete it.dataset.html; }
  render();
  if(!ok) return;
  const need = Math.min(2, S.members.filter(m => m.id !== S.me).length);
  toast(need ? `¡Hecha! Los +${pts} pts cuentan cuando ${need === 1 ? 'alguien más la apruebe' : '2 de los demás la aprueben'}.` : `+${pts} pts para ${me.name}.`, {tone: me.color, undo: async () => {
    await write(() => DB.doc('tasks/' + id).update({done:false, doneBy:null, doneAt:null}));
    if(nextRef){ const r = nextRef; await write(() => r.delete()); }
  }});
}

async function reopenTask(id){
  const t = S.done.find(x => x.id === id);
  if(!t) return;
  const prev = {done:true, doneBy:t.doneBy, doneAt:t.doneAt};
  Object.keys(t).filter(k => k.startsWith('rv_')).forEach(k => prev[k] = t[k]);
  const ok = await write(() => DB.doc('tasks/' + id).update({done:false, doneBy:null, doneAt:null, ...rvClear(t)}));
  if(ok) toast(`"${t.title}" volvió a pendientes`, {tone:'sun', undo: () => write(() => DB.doc('tasks/' + id).update(prev))});
}

async function addGrocery(raw, catOverride, qtyOverride){
  if(needMe()) return false;
  const p = parseItem(raw);
  const name = p.name;
  const qty = qtyOverride !== undefined ? (qtyOverride || null) : p.qty;
  if(!name) return false;
  const dup = toBuy().find(g => norm(g.name) === norm(name));
  if(dup){ toast(`${name} ya está en la lista`, {tone:'sun'}); return true; }
  const cat = catOverride || guessCat(name) || 'otros';
  const now = new Date().toISOString();
  const ref = DB.collection('groceries').doc();
  const ok = await write(() => ref.set({name, qty, cat, addedBy:S.me, createdAt:now, bought:false, boughtBy:null, boughtAt:null}));
  if(ok){
    write(() => DB.doc('catalog/' + slug(name)).set({name, cat, lastAdded:now}));
    toast(`${name} → ${CAT_BY_ID[cat].name}`, {tone:CAT_BY_ID[cat].color, ms:2200});
  }
  return ok;
}

async function toggleGrocery(id){

async function clearCart(){
  const cart = S.groceries.filter(g => g.bought);
  if(!cart.length) return;
  const backup = cart.map(g => { const {id, ...data} = g; return {id, data}; });
  const ok = await write(() => Promise.all(cart.map(g => DB.doc('groceries/' + g.id).delete())));

let sheetState = null;
function openSheet({title, body, onMount}){
  const sheet = $('#sheet'), scrim = $('#scrim');
  if(sheetState) closeSheet(true);
  sheet.innerHTML = `<div class="grab" aria-hidden="true"></div><div class="sheet-h"><h2 id="sheetTitle">${esc(title)}</h2><button class="iconbtn sm" data-act="sheet-close" aria-label="Cerrar">${ICON.close}</button></div><div class="sheet-b">${body}</div>`;
  sheet.onclick = null; sheet.onchange = null; sheet.oninput = null;
  sheet.hidden = false; scrim.hidden = false;
  sheet.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open'); }));
  document.body.classList.add('locked');
  sheetState = {lastFocus: document.activeElement};
  syncChrome();
  onMount && onMount(sheet);
}
function closeSheet(instant){
  if(!sheetState) return;
  const st = sheetState; sheetState = null;
  syncChrome();
  const sheet = $('#sheet'), scrim = $('#scrim');
  sheet.classList.remove('open'); scrim.classList.remove('open');
  const fin = () => { if(!sheetState){ sheet.hidden = true; scrim.hidden = true; sheet.innerHTML = ''; } };
  instant ? fin() : setTimeout(fin, 300);
  unlockIfFree();
  try { st.lastFocus && st.lastFocus.focus && st.lastFocus.focus({preventScroll:true}); } catch {}
}

  };
  openSheet({
    title: isEdit ? 'Editar tarea' : 'Nueva tarea',
    body: `<form id="tf" novalidate>
      <label class="field" style="margin-top:6px"><span class="label">¿Qué hay que hacer?</span><input class="input" id="tfTitle" maxlength="70" placeholder="Ej: Lavar los platos" value="${esc(d.title)}" autocomplete="off"></label>
      <p class="form-err" id="tfErr" hidden>Escribe qué hay que hacer.</p>
      ${isEdit ? '' : `<div class="scroller sugg-row" aria-label="Sugerencias">${CHORES.map((c, i) => `<button type="button" class="pill" data-f="chore" data-v="${i}">${esc(roomById(choreRoom(c)).emoji)} ${esc(c.t)}</button>`).join('')}</div>`}
      <div id="tfOpts"></div>
      <button class="btn-primary" type="submit" id="tfSubmit"></button>
      ${isEdit ? `<button type="button" class="btn-danger" data-f="delete" id="tfDel">${ICON.trash}Eliminar tarea</button>` : ''}
    </form>`,
    onMount(sheet){
      const paint = () => {
        $('#tfOpts').innerHTML = opts();
        $('#tfSubmit').innerHTML = `${isEdit ? 'Guardar cambios' : 'Crear tarea'} · +${DIFFS[d.diff].pts} pts`;
      };
      paint();
      sheet.onclick = async e => {
        if(e.target.id === 'tfDate'){ try { e.target.showPicker(); } catch {} return; }
        const b = e.target.closest('[data-f]');
        if(!b) return;
        const f = b.dataset.f, v = b.dataset.v;
        if(f === 'room') d.room = v;
        else if(f === 'diff') d.diff = v;
        else if(f === 'who') d.assignee = v || null;
        else if(f === 'due') d.due = dueFromKey(v);
        else if(f === 'repeat') d.repeat = v;
        else if(f === 'chore'){ const c = CHORES[+v]; $('#tfTitle').value = c.t; d.room = choreRoom(c); d.diff = c.d; $('#tfErr').hidden = true; $('#tfTitle').classList.remove('bad'); }
        else if(f === 'delete'){
          if(!armed){ armed = true; b.classList.add('armed'); b.innerHTML = `${ICON.trash}Toca otra vez para eliminar`; return; }

          return;
        }
        else if(b.classList.contains('date-opt')) return;
        paint();
      };
      sheet.onchange = e => { if(e.target.id === 'tfDate'){ d.due = e.target.value || null; paint(); } };
      $('#tf').onsubmit = async e => {
        e.preventDefault();
        if(busy) return;
        const title = $('#tfTitle').value.trim().replace(/\s+/g, ' ');
        if(!title){ $('#tfErr').hidden = false; $('#tfTitle').classList.add('bad'); $('#tfTitle').focus(); return; }
        busy = true; $('#tfSubmit').disabled = true;
        const data = {title: cap(title), room:d.room, diff:d.diff, points:DIFFS[d.diff].pts, assignee:d.assignee || null, due:d.due || null, repeat:d.repeat};
        let ok;
        if(isEdit) ok = await write(() => DB.doc('tasks/' + existing.id).update(data));
        else { const ref = DB.collection('tasks').doc(); ok = await write(() => ref.set({...data, done:false, doneBy:null, doneAt:null, createdBy:S.me, createdAt:new Date().toISOString()})); }
        busy = false;
        const sb = $('#tfSubmit'); if(sb) sb.disabled = false;
        if(ok){ closeSheet(); toast(isEdit ? 'Cambios guardados' : `Tarea creada: ${data.title}`, {tone:'mint', ms:2400}); }
      };
      $('#tfTitle').addEventListener('input', () => { $('#tfErr').hidden = true; $('#tfTitle').classList.remove('bad'); });
      if(!isEdit) setTimeout(() => $('#tfTitle')?.focus({preventScroll:true}), 320);
    },
  });
}

        else if(f === 'radd'){ draft.rooms.push({id:'', name:'', emoji:'📍', color:COLORS[(draft.rooms.length + 3) % COLORS.length], w:2, h:1}); paint(); $('#stRn' + (draft.rooms.length - 1))?.focus(); }
        else if(f === 'look'){
          LOOK[b.dataset.k] = b.dataset.v; lsSet('casa.' + b.dataset.k, b.dataset.v); applyLook(); chromeKey = '';
          b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          render();
        }
        else if(f === 'wday'){
          const v = +b.dataset.v;
          if(v === WEEK_DAY) return;
          const ok = await write(() => DB.doc('config/house').update({weekDay: v, updatedAt: new Date().toISOString()}));
          if(ok){ WEEK_DAY = v; paintWeek(); render(); toast(`Listo: la semana ahora va de ${weekStartName()} a ${weekEndName()}.`, {tone:'sky', ms:2800}); }
        }
        else if(f === 'reset'){
          if(!b.classList.contains('armed')){ b.classList.add('armed'); b.innerHTML = `${ICON.undo}Toca otra vez para reiniciar`; return; }
          const prev = S.pointsSince || null;
          const ok = await write(() => DB.doc('config/house').update({pointsSince: new Date().toISOString(), pointsSinceBy: S.me || null}));
          if(ok){
            paintWeek(); render();
            toast('Puntos en 0 para todos. ¡Arranca la competencia!', {tone:'grape', undo: () => write(() => DB.doc('config/house').update({pointsSince: prev}))});
          }
        }
        else if(f === 'switch'){ closeSheet(); S.forcePicker = true; render(); }
        else if(f === 'share'){ shareInvite(); }
        else if(f === 'copy'){ copyText(inviteLink(), 'Link copiado. Pégalo en WhatsApp.'); }
        else if(f === 'install'){ closeSheet(); setTimeout(doInstall, 320); }
        else if(f === 'leave'){
          if(!b.classList.contains('armed')){ b.classList.add('armed'); b.innerHTML = `${ICON.close}Toca otra vez para salir`; return; }
          closeSheet();
          stopRealtime();
          try { localStorage.removeItem(cacheKey()); } catch {}
          lsSet('casa.code', null); lsSet('casa.topic', null); lsSet('casa.me', null);
          CODE = null; DB = null; S.me = null; S.synced = false; S.subscribed = false; S.configLoaded = false; S.configExists = false;
          S.members = []; S.pending = []; S.done = []; S.groceries = []; S.weeks = {}; S.catalog = [];
          S.needCode = true; S.codeError = ''; S.mounted = null;
          render();
        }
        else if(f === 'save'){
          const members = draft.members.map(m => ({...m, name: cap(m.name.trim().replace(/\s+/g, ' ')).slice(0, 20)})).filter(m => m.name);
          const rooms = draft.rooms.map(r => ({...r, name: cap(r.name.trim().replace(/\s+/g, ' ')).slice(0, 24), emoji: (r.emoji || '').trim() || '📍'})).filter(r => r.name);
          const err = $('#stErr');
          if(!members.length){ err.textContent = 'La casa necesita al menos una persona.'; err.hidden = false; return; }
          if(!rooms.length){ err.textContent = 'Agrega al menos un lugar de la casa.'; err.hidden = false; return; }
          members.forEach(m => { if(!m.id) m.id = slug(m.name) + '-' + rid(); });
          rooms.forEach(r => { if(!r.id) r.id = slug(r.name) + '-' + rid(); });
          const ok = await write(() => DB.doc('config/house').update({members, rooms, updatedAt:new Date().toISOString()}));
          if(ok){ closeSheet(); toast('Ajustes guardados', {tone:'mint', ms:2000}); }
        }
      };
    },
  });
}

/* =========================================================
   Toasts y efectos
   ========================================================= */
function toast(msg, {undo, action, tone = 'grape', ms = 4200} = {}){
  const wrap = $('#toasts');
  while(wrap.children.length >= 3) wrap.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast t-' + safeColor(tone);
  el.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = msg;
  el.append(span);
  let timer;
  const dismiss = () => { clearTimeout(timer); el.classList.add('out'); setTimeout(() => el.remove(), 240); };
  if(undo || action){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = undo ? 'Deshacer' : action.label;
    b.onclick = async () => { dismiss(); await (undo ? undo() : action.fn()); };
    el.append(b);
  }
  wrap.append(el);
  timer = setTimeout(dismiss, undo || action ? 6500 : ms);
}

const fx = $('#fx');
const fxCtx = fx.getContext('2d');
let parts = [], fxRaf = 0;
function sizeFx(){ const dpr = Math.min(2, window.devicePixelRatio || 1); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function burst(x, y, color){
  if(reduceMotion()) return;
  const cs = getComputedStyle(document.documentElement);
  const pal = ['sun', 'tangerine', 'pink', 'mint', 'sky', 'grape'].map(c => cs.getPropertyValue('--c-' + c).trim());
  const main = cs.getPropertyValue('--c-' + safeColor(color)).trim() || pal[0];
  if(!parts.length) sizeFx();
  for(let i = 0; i < 38; i++){
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.6;
    const sp = 4 + Math.random() * 7;
    parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6.28, vr: (Math.random() - .5) * .45, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: i % 3 === 0 ? main : pal[i % pal.length], life: 0, max: 50 + Math.random() * 30, round: i % 5 === 0});
  }
  if(!fxRaf) fxRaf = requestAnimationFrame(tick);
}
function tick(){
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  for(const p of parts){
    p.life++; p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    fxCtx.translate(p.x, p.y); fxCtx.rotate(p.r);
    fxCtx.fillStyle = p.c;
    if(p.round){ fxCtx.beginPath(); fxCtx.arc(0, 0, p.h, 0, 6.28); fxCtx.fill(); }
    else fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fxCtx.restore();
  }
  parts = parts.filter(p => p.life < p.max);
  if(parts.length) fxRaf = requestAnimationFrame(tick);
  else { fxRaf = 0; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
}
function floatPts(rect, text, color){
  if(reduceMotion()) return;
  const el = document.createElement('div');
  el.className = 'floatpts t-' + safeColor(color);
  el.textContent = text;
  el.style.left = (rect.left + rect.width / 2) + 'px';
  el.style.top = (rect.top - 8) + 'px';
  document.body.append(el);
  setTimeout(() => el.remove(), 1100);
}

/* =========================================================
   Eventos
   ========================================================= */
const ACTIONS = {
  tab(b){
    const t = b.dataset.tab;
    if(S.tab === t){ window.scrollTo({top:0, behavior: reduceMotion() ? 'auto' : 'smooth'}); return; }
    switchTab(t);
  },
  'open-add'(){ S.tab === 'mercado' ? openGrocerySheet() : openTaskSheet(); },
  complete(b){ completeTask(b.dataset.id, b); },
  'edit-task'(b){ const t = S.pending.find(x => x.id === b.dataset.id); if(t) openTaskSheet(t); },
  reopen(b){ reopenTask(b.dataset.id); },
  vote(b){ openReviewSheet(b.dataset.id, b.dataset.v); },
  'review-open'(b){ openReviewSheet(b.dataset.id); },
  tview(b){ S.taskView = b.dataset.v; lsSet('casa.taskView', S.taskView); render(); },
  tstatus(b){ S.taskStatus = b.dataset.v; if(S.taskStatus === 'done' && S.taskWho === 'none') S.taskWho = 'all'; render(); },
  twho(b){ S.taskWho = b.dataset.v; render(); },
  room(b){ S.taskRoom = b.dataset.room; S.taskView = 'list'; S.taskStatus = 'pending'; S.taskWho = 'all'; lsSet('casa.taskView', 'list'); if(S.tab !== 'tareas') switchTab('tareas'); else { render(); window.scrollTo({top:0}); } },
  'room-clear'(){ S.taskRoom = null; render(); },
  'quick-chore'(b){ quickChore(b.dataset.t); },
  prize(){ openPrizeSheet(); },
  super(){ S.superMode = !S.superMode; lsSet('casa.super', S.superMode ? '1' : '0'); render(); },
  'qa-cat'(){ openCatPicker(); },
  'g-toggle'(b){ toggleGrocery(b.dataset.id); },
  'g-edit'(b){ const g = S.groceries.find(x => x.id === b.dataset.id); if(g) openGrocerySheet(g); },
  'g-sugg'(b){ addGrocery(b.dataset.n); },
  'g-clear'(){ clearCart(); },
  settings(){ if(!S.configExists || !DB) return; openSettings(); },
  profile(){ if(!S.configExists) return; S.forcePicker = true; render(); },
  'pick-me'(b){ S.me = b.dataset.id; lsSet('casa.me', S.me); S.forcePicker = false; render(); const m = meM(); if(m) toast(`Hola, ${m.name}`, {tone:m.color, ms:1800}); },
  'gate-cancel'(){ S.forcePicker = false; render(); },
  'sheet-close'(){ closeSheet(); },
  install(){ doInstall(); },
  'install-hide'(){ lsSet('casa.installHide', '1'); render(); toast('Puedes instalarla después desde Ajustes.', {tone:'grape', ms:2600}); },
  'retry-sync'(){ syncNow(); if(!RT.ws) rtConnect(); },
  'ob-del'(b){ S.obNames.splice(+b.dataset.i, 1); renderGate(true); },
  async 'ob-save'(b){
    if(!S.obNames.length) return;
    b.disabled = true;
    const members = S.obNames.map((n, i) => ({id: slug(n) + '-' + rid(), name:n, color:COLORS[i % COLORS.length], emoji:''}));
    const ok = await write(() => DB.doc('config/house').set({members, rooms:DEFAULT_ROOMS, updatedAt:new Date().toISOString()}));
    b.disabled = false;
    if(ok){ S.obNames = []; S.me = null; lsSet('casa.me', null); }
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const fn = ACTIONS[b.dataset.act];
  if(fn){ e.preventDefault(); fn(b, e); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && sheetState) closeSheet();
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.dataset.act && ACTIONS[t.dataset.act]){ e.preventDefault(); ACTIONS[t.dataset.act](t, e); }
});
document.addEventListener('touchstart', () => {}, {passive:true});
const onScroll = () => { const was = document.body.classList.contains('scrolled'), is = scrollY > 6; if(was !== is){ document.body.classList.toggle('scrolled', is); syncChrome(); } };
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', () => { if(parts.length) sizeFx(); });
setInterval(() => { if(S.tab === 'inicio' || S.tab === 'ranking') render(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) render(); });

boot();
})();

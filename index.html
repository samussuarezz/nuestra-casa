<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PC 3051</title>
<meta name="description" content="La app de la casa: tareas por lugar, puntos con premio semanal y lista del mercado.">
<meta name="theme-color" content="#F3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100E1B" media="(prefers-color-scheme: dark)">
<script>try{var lt=localStorage.getItem('casa.theme');if(lt==='dark'||lt==='light'){document.documentElement.dataset.theme=lt;var lc=lt==='dark'?'#100E1B':'#F3F0FA';document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=lc;});}}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one-column phone app (max 560px). Inicio = bento tiles · Tareas = list or a floor plan of the house · Ranking = podium + prize ticket · Mercado = list grouped by supermarket aisle. Floating tab bar with a raised "+"; create/edit happens in bottom sheets. */
:root{
  --bg:#F3F0FA;
  --surface:#FFFFFF;
  --surface-2:#ECE8F6;
  --ink:#1D1934;
  --ink-2:#4F4970;
  --ink-3:#7A7499;
  --line:#E3DEF0;
  --scrim:rgba(20,16,40,.42);
  --toast-bg:#1D1934;
  --toast-fg:#FFFFFF;
  --toast-act:#FFC23D;
  --shadow-sm:0 1px 2px rgba(29,25,52,.06),0 6px 16px -10px rgba(29,25,52,.28);
  --shadow:0 2px 4px rgba(29,25,52,.05),0 16px 32px -18px rgba(29,25,52,.4);
  --c-tangerine:#F2602A;
  --c-pink:#E5307A;
  --c-mint:#0E9A6B;
  --c-sky:#1B7FE3;
  --c-grape:#6A46EE;
  --c-sun:#FFB51F;
  --c-teal:#08909A;
  --c-red:#DE3B33;
  --c-gray:#7A7499;
  --tone:var(--c-grape);
  --on-tone:#FFFFFF;
  --focus:#6A46EE;
  --blob-op:.5;
  --font-display:"Bricolage Grotesque","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100E1B; --surface:#1B1830; --surface-2:#262140; --ink:#F5F2FF; --ink-2:#C6BFE2; --ink-3:#938CB3; --line:#2F2A4B;
    --scrim:rgba(0,0,0,.6); --toast-bg:#F5F2FF; --toast-fg:#1D1934; --toast-act:#C2410C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 8px 18px -12px rgba(0,0,0,.8);
    --shadow:0 2px 4px rgba(0,0,0,.3),0 18px 34px -18px rgba(0,0,0,.9);
    --c-tangerine:#FF7A45; --c-pink:#FF4F93; --c-mint:#20BE88; --c-sky:#3D9BFF; --c-grape:#8B6DFF; --c-sun:#FFC23D; --c-teal:#14B1BA; --c-red:#F25A50; --c-gray:#938CB3;
    --focus:#A893FF; --blob-op:.2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100E1B; --surface:#1B1830; --surface-2:#262140; --ink:#F5F2FF; --ink-2:#C6BFE2; --ink-3:#938CB3; --line:#2F2A4B;
  --scrim:rgba(0,0,0,.6); --toast-bg:#F5F2FF; --toast-fg:#1D1934; --toast-act:#C2410C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 8px 18px -12px rgba(0,0,0,.8);
  --shadow:0 2px 4px rgba(0,0,0,.3),0 18px 34px -18px rgba(0,0,0,.9);
  --c-tangerine:#FF7A45; --c-pink:#FF4F93; --c-mint:#20BE88; --c-sky:#3D9BFF; --c-grape:#8B6DFF; --c-sun:#FFC23D; --c-teal:#14B1BA; --c-red:#F25A50; --c-gray:#938CB3;
  --focus:#A893FF; --blob-op:.2;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.45;font-weight:600;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.t-tangerine{--tone:var(--c-tangerine);--on-tone:#fff}
.t-pink{--tone:var(--c-pink);--on-tone:#fff}
.t-mint{--tone:var(--c-mint);--on-tone:#fff}
.t-sky{--tone:var(--c-sky);--on-tone:#fff}
.t-grape{--tone:var(--c-grape);--on-tone:#fff}
.t-sun{--tone:var(--c-sun);--on-tone:#3B2700}
.t-teal{--tone:var(--c-teal);--on-tone:#fff}
.t-red{--tone:var(--c-red);--on-tone:#fff}
.t-gray{--tone:var(--c-gray);--on-tone:#fff}

/* ---------- ambient ---------- */
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-op)}
.blobs i:nth-child(1){width:300px;height:300px;background:var(--c-sun);top:-140px;left:-90px}
.blobs i:nth-child(2){width:280px;height:280px;background:var(--c-pink);top:-90px;right:-150px;opacity:calc(var(--blob-op)*.55)}
.blobs i:nth-child(3){width:320px;height:320px;background:var(--c-mint);bottom:-190px;left:10%;opacity:calc(var(--blob-op)*.45)}

.app{position:relative;z-index:1;max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px;background:color-mix(in oklab,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .logo{width:30px;height:30px}
.iconbtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-sm)}
.iconbtn svg{width:21px;height:21px}
.iconbtn.sm{width:40px;height:40px;border-radius:13px;box-shadow:none;background:var(--surface-2)}
.mebtn{display:flex;align-items:center;gap:6px;height:44px;padding:4px 10px 4px 4px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:14px}
.mebtn svg{width:14px;height:14px;color:var(--ink-3)}

.banner{display:flex;gap:10px;align-items:flex-start;margin-top:6px;padding:10px 14px;border-radius:16px;font-size:13.5px;font-weight:700;background:color-mix(in oklab,var(--tone) 14%,var(--surface));color:color-mix(in oklab,var(--tone) 50%,var(--ink))}
.banner svg{width:18px;height:18px;margin-top:1px}

/* ---------- avatars ---------- */
.av{--size:36px;width:var(--size);height:var(--size);flex:none;display:inline-grid;place-items:center;border-radius:36%;background:linear-gradient(150deg,color-mix(in oklab,var(--tone) 72%,#fff),var(--tone) 70%);color:var(--on-tone);font-family:var(--font-display);font-weight:800;font-size:calc(var(--size)*.46);line-height:1;box-shadow:0 0 0 2.5px var(--surface);user-select:none}
.av .emo{font-size:calc(var(--size)*.6);font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.av.xxs{--size:22px;box-shadow:none;border-radius:8px}
.av.xs{--size:28px}
.av.sm{--size:32px}
.av.lg{--size:58px}
.av.xl{--size:96px;border-radius:34%}

/* ---------- headings ---------- */
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hello{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,9vw,42px);line-height:1;letter-spacing:-.03em;margin-top:6px;text-wrap:balance}
.hello .nm{color:color-mix(in oklab,var(--tone) 82%,var(--ink));text-decoration:underline wavy var(--tone);text-decoration-thickness:3px;text-underline-offset:7px;text-decoration-skip-ink:none}
.view-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.view-h h1{font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.05}
.view-h .count{font-size:14px;color:var(--ink-3);font-weight:800}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 2px 10px}
.sec-h h2{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.015em}
.link{font-weight:800;font-size:14px;color:var(--ink-2);padding:10px 8px;margin:-10px -8px;border-radius:10px}

/* ---------- bento ---------- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.span2{grid-column:1/-1}
.tile .tl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.tile .tl svg{width:16px;height:16px}
.tile-me{min-height:150px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in oklab,var(--tone) 55%,#fff) 0%,transparent 55%),linear-gradient(150deg,var(--tone),color-mix(in oklab,var(--tone) 72%,#000));color:#fff;box-shadow:0 18px 34px -18px var(--tone)}
.tile-me .big{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.04em;margin-top:8px;font-variant-numeric:tabular-nums}
.tile-me .big small{font-size:20px;letter-spacing:0;margin-left:4px;opacity:.85}
.tile-me .tsub{font-size:14.5px;font-weight:700;opacity:.95;margin-top:6px;max-width:72%}
.tile-me .place{position:absolute;right:14px;top:14px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;align-content:center;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.55);text-align:center;line-height:1}
.tile-me .place b{font-family:var(--font-display);font-size:30px;font-weight:800}
.tile-me .place small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;opacity:.9}
.tile-me .deco{position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.12)}

.ticket{--foot:46px;--notch:13px;background:linear-gradient(115deg,var(--c-sun),color-mix(in oklab,var(--c-sun) 40%,var(--c-tangerine)) 100%);color:#2E1800;padding:16px 18px 0;box-shadow:none;-webkit-mask:radial-gradient(circle var(--notch) at 0 calc(100% - var(--foot)),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at 100% calc(100% - var(--foot)),#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle var(--notch) at 0 calc(100% - var(--foot)),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at 100% calc(100% - var(--foot)),#0000 97%,#000) right/51% 100% no-repeat}
.ticket .prize{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1.12;letter-spacing:-.02em;margin:6px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.ticket .prize.is-empty{opacity:.7}
.ticket .tfoot{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--foot);border-top:2.5px dashed rgba(46,24,0,.3);margin-inline:-2px;font-size:13.5px;font-weight:800}
.ticket .tfoot span{display:flex;align-items:center;gap:6px}
.ticket .tfoot svg{width:16px;height:16px}
.ticket .edit{font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.45)}

.tile.soft{background:color-mix(in oklab,var(--tone) 13%,var(--surface));box-shadow:none;min-height:122px}
.tile .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--tone);color:var(--on-tone);margin-bottom:auto}
.tile .ic svg{width:21px;height:21px}
.tile .num{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.03em;margin-top:12px;color:color-mix(in oklab,var(--tone) 60%,var(--ink));font-variant-numeric:tabular-nums}
.tile .tl2{font-weight:800;font-size:14px;color:var(--ink-2)}
.tile .tiny{position:absolute;top:16px;right:14px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--c-red);color:#fff}

.winner{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.winner .crown{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:color-mix(in oklab,var(--c-sun) 25%,var(--surface));color:color-mix(in oklab,var(--c-sun) 70%,var(--ink))}
.winner .crown svg{width:24px;height:auto}
.winner p{font-size:14px;font-weight:700;color:var(--ink-2);min-width:0}
.winner b{color:var(--ink);font-weight:900}

/* ---------- tasks ---------- */
.tasks{display:flex;flex-direction:column;gap:10px}
.group-h{display:flex;align-items:center;gap:8px;margin:20px 4px 8px;font-size:12.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group-h .dot{width:8px;height:8px;border-radius:50%;background:var(--tone)}
.group-h .n{margin-left:auto;font-variant-numeric:tabular-nums}
.task{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);max-height:200px;transition:opacity .25s,transform .25s,max-height .3s,padding .3s,margin .3s}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:4px 0;border-radius:12px}
.task-title{font-weight:800;font-size:16px;line-height:1.25;overflow-wrap:anywhere;transition:color .2s}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;background:color-mix(in oklab,var(--tone) 14%,var(--surface));color:color-mix(in oklab,var(--tone) 58%,var(--ink))}
.chip svg{width:13px;height:13px}
.chip.ghost{background:var(--surface-2);color:var(--ink-2)}
.by{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.anyone{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.anyone svg{width:16px;height:16px}
.check{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;border:2.5px solid color-mix(in oklab,var(--tone) 50%,var(--line));background:color-mix(in oklab,var(--tone) 7%,var(--surface));color:var(--on-tone);transition:transform .15s,background .2s,border-color .2s}
.check svg{width:22px;height:22px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s}
.check:hover{border-color:var(--tone)}
.check:active{transform:scale(.88)}
.task.completing .check,.check.on{background:var(--tone);border-color:var(--tone)}
.task.completing .check{animation:pop .4s}
.task.completing .check svg,.check.on svg{stroke-dashoffset:0}
.task.completing .task-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.task.leaving{opacity:0;transform:translateX(40px) rotate(2deg);max-height:0;padding-block:0;margin-block:-5px}
.task.done{box-shadow:none;background:color-mix(in oklab,var(--surface) 70%,transparent)}
.task.done .task-title{color:var(--ink-2)}
.mini{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.mini svg{width:18px;height:18px}

.pts{--dt:var(--c-sun);display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 9px;border-radius:11px;font-family:var(--font-display);font-weight:800;font-size:14.5px;line-height:1;font-variant-numeric:tabular-nums;background:color-mix(in oklab,var(--dt) 18%,var(--surface));color:color-mix(in oklab,var(--dt) 52%,var(--ink))}
.d-facil{--dt:var(--c-mint)}
.d-media{--dt:var(--c-sun)}
.d-dificil{--dt:var(--c-pink)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.bars i{width:3.5px;border-radius:2px;background:color-mix(in oklab,var(--dt) 28%,transparent)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8.5px}.bars i:nth-child(3){height:12px}
.b1 i:nth-child(1),.b2 i:nth-child(-n+2),.b3 i{background:var(--dt)}

/* ---------- segmented / filters ---------- */
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:16px;background:var(--surface-2)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:12px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg .n{font-variant-numeric:tabular-nums;color:var(--ink-3)}
.filters{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px 0 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.fchip.plain{padding-left:14px}
.fchip svg{width:16px;height:16px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fchip[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--ink)}
.roomfilter{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;background:color-mix(in oklab,var(--tone) 14%,var(--surface));color:color-mix(in oklab,var(--tone) 55%,var(--ink));font-weight:800}
.roomfilter .x{margin-left:auto}

/* ---------- house plan ---------- */
.house{margin-top:18px;color:var(--ink)}
.roof{width:100%;height:auto;margin-bottom:-2px}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(96px,auto);grid-auto-flow:row dense;gap:6px;margin-inline:12px;padding:6px;background:var(--ink);border-radius:4px 4px 26px 26px}
.room{position:relative;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;padding:10px;border-radius:14px;background:color-mix(in oklab,var(--tone) 22%,var(--surface));text-align:left;overflow:hidden;transition:transform .15s,filter .15s}
.room:active{transform:scale(.97)}
.room.w2{grid-column:span 2}.room.w3{grid-column:span 3}.room.w4{grid-column:span 4}.room.h2{grid-row:span 2}
.room .re{font-size:26px;line-height:1;margin-bottom:auto;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.room.h2 .re{font-size:40px}
.room .rn{font-weight:900;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.room .rc{font-size:12px;font-weight:800;color:color-mix(in oklab,var(--tone) 55%,var(--ink))}
.room .rbadge{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--tone);color:var(--on-tone);font-family:var(--font-display);font-weight:800;font-size:15px}
.room .rbadge.late{box-shadow:0 0 0 3px color-mix(in oklab,var(--c-red) 70%,transparent)}
.room.w1 .rc{display:none}
.room.w1 .rn{font-size:12.5px;hyphens:auto}
.room.clean{background:var(--surface)}
.room.clean .rc{color:var(--c-mint)}
.room.clean .re{filter:saturate(.6);opacity:.85}
.plan-foot{margin:10px 12px 0}
.plan-foot .room{width:100%;min-height:64px;flex-direction:row;align-items:center;gap:10px;border-radius:18px}
.plan-foot .room .re{margin:0}
.plan-legend{margin:12px 14px 0;font-size:13px;color:var(--ink-3);font-weight:700}

/* ---------- ranking ---------- */
.week-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;color:var(--ink-3);font-weight:800;font-size:14px}
.week-row .pill-time{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink-2)}
.week-row svg{width:15px;height:15px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-top:26px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-weight:900;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pod .block{width:100%;display:grid;place-items:center;border-radius:18px 18px 10px 10px;background:linear-gradient(180deg,var(--tone),color-mix(in oklab,var(--tone) 70%,#000));color:var(--on-tone);font-family:var(--font-display);font-weight:800;font-size:34px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.pod.p1 .block{height:126px;font-size:44px}
.pod.p2 .block{height:92px}
.pod.p3 .block{height:66px}
.pod.p1 .av{--size:74px}
.pod .crownwrap{position:relative;padding-top:22px}
.pod .crownwrap svg{position:absolute;top:0;left:50%;width:40px;height:auto;transform:translateX(-50%) rotate(-8deg);color:var(--c-sun);animation:wob 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.pod.is-zero .block{background:var(--surface-2);color:var(--ink-3);box-shadow:none}
.ranklist{display:flex;flex-direction:column;margin-top:18px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.rrow{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .pos{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--ink-3);text-align:center}
.rrow .who{min-width:0}
.rrow .who b{display:block;font-weight:900;font-size:15.5px}
.rrow .who small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--tone);transition:width .5s cubic-bezier(.2,.9,.3,1.1)}
.rrow .rp{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rrow .rp small{font-size:12px;color:var(--ink-3);margin-left:2px}
.rrow.me{background:color-mix(in oklab,var(--tone) 8%,var(--surface))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm)}
.stat b{display:block;font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3);font-weight:800}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rule{padding:12px 10px;border-radius:18px;text-align:center;background:color-mix(in oklab,var(--dt) 15%,var(--surface))}
.rule b{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;color:color-mix(in oklab,var(--dt) 55%,var(--ink))}
.rule span{display:block;font-weight:900;font-size:14px}
.rule small{display:block;font-size:12px;color:var(--ink-3);font-weight:700;margin-top:2px}
.note{margin-top:10px;font-size:13.5px;color:var(--ink-3);font-weight:700;line-height:1.5}
.hof{display:flex;flex-direction:column;gap:8px}
.hof-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm)}
.hof-row .wk{font-size:12.5px;font-weight:800;color:var(--ink-3)}
.hof-row b{font-weight:900}
.hof-row .hp{font-size:13px;color:var(--ink-2);font-weight:700}
.hof-row .grow{min-width:0;flex:1}
.hof-row .rp{font-family:var(--font-display);font-weight:800;font-size:16px}

/* ---------- mercado ---------- */
.qa{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:12;display:flex;align-items:center;gap:8px;margin-top:14px;padding:7px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.qa-in{flex:1;min-width:0;height:48px;padding:0 6px;border:0;background:transparent;font-size:16px;font-weight:800;outline:none}
.qa-in::placeholder{color:var(--ink-3);font-weight:700}
.catbtn{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:23px;background:color-mix(in oklab,var(--tone) 16%,var(--surface));font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.addbtn{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,var(--c-pink),var(--c-tangerine));color:#fff}
.addbtn svg{width:22px;height:22px}
.qa-hint{min-height:22px;margin:8px 6px 0;font-size:13px;font-weight:700;color:var(--ink-3)}
.qa-hint b{color:var(--ink-2)}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;background:var(--surface);border:2px dashed var(--line);font-weight:800;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.pill:hover{border-color:var(--ink-3)}
.pill svg{width:14px;height:14px}
.gcat{margin-top:20px}
.gcat-h{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.gcat-h .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in oklab,var(--tone) 18%,var(--surface));font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.gcat-h h3{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.gcat-h .n{margin-left:auto;font-weight:900;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gcat-h .act{margin-left:auto}
.glist{border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.gitem{display:flex;align-items:center;gap:8px;min-height:58px;padding:5px 12px 5px 6px;border-top:1px solid var(--line)}
.gitem:first-child{border-top:0}
.gbox{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px}
.gbox .sq{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;border:2.5px solid color-mix(in oklab,var(--tone) 55%,var(--line));color:var(--on-tone);transition:background .15s,transform .15s}
.gbox .sq svg{width:16px;height:16px;opacity:0}
.gbox:active .sq{transform:scale(.85)}
.gitem.bought .sq{background:var(--tone);border-color:var(--tone)}
.gitem.bought .sq svg{opacity:1}
.gname{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:10px 0;font-weight:800;font-size:16px;overflow-wrap:anywhere;border-radius:10px}
.gitem.bought .gname{color:var(--ink-3);text-decoration:line-through}
.qty{font-family:var(--font-display);font-weight:800;font-size:13px;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);text-decoration:none}
.cart .glist{background:color-mix(in oklab,var(--surface) 60%,transparent);box-shadow:none;border:2px dashed var(--line)}
.btn-text{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;font-weight:800;font-size:13.5px;background:var(--surface-2);color:var(--ink-2)}
.btn-text svg{width:15px;height:15px}
.super-bar{margin-top:14px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.super-bar .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.super-bar .row b{font-family:var(--font-display);font-size:22px}
.progress{height:14px;margin-top:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c-mint),var(--c-sky));transition:width .4s}
.is-super .gitem{min-height:68px}
.is-super .gname{font-size:18.5px}
.is-super .gbox .sq{width:32px;height:32px}
.toggle{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:14px;color:var(--ink-2)}
.toggle .sw{width:38px;height:24px;border-radius:99px;background:var(--surface-2);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--c-mint)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

/* ---------- empty / loading ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 18px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-sm)}
.empty .art{width:84px;height:84px;border-radius:30px;display:grid;place-items:center;font-size:42px;background:color-mix(in oklab,var(--tone) 16%,var(--surface));transform:rotate(-6deg);margin-bottom:6px;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.empty h3{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.empty p{color:var(--ink-3);font-weight:700;font-size:14px;max-width:34ch}
.empty .scroller,.empty .wrapopts{margin-top:10px}
.wrapopts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.skel{border-radius:22px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(560px,100%);padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar-in{display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:70px;padding:0 6px;border-radius:26px;background:color-mix(in oklab,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 1px 0 var(--line),0 18px 40px -16px rgba(29,25,52,.45)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border-radius:18px;font-size:11.5px;font-weight:800;color:var(--ink-3);transition:color .2s}
.tab svg{width:25px;height:25px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.08);color:var(--tone)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--c-pink);color:#fff;box-shadow:0 0 0 2.5px var(--surface);font-style:normal}
.fab{justify-self:center;width:64px;height:64px;margin-top:-30px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c-sun) -10%,var(--c-tangerine) 45%,var(--c-pink) 100%);box-shadow:0 12px 24px -8px color-mix(in oklab,var(--c-pink) 70%,transparent),0 0 0 5px var(--bg);transform:rotate(-6deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.fab svg{width:30px;height:30px}
.fab:hover{transform:rotate(0) scale(1.04)}
.fab:active{transform:rotate(0) scale(.94)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:51;width:min(560px,100%);max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,105%);transition:transform .34s cubic-bezier(.2,.95,.3,1.08);padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:var(--surface);box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 4px}
.sheet-h{position:sticky;top:-6px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 6px;background:var(--surface)}
.sheet-h h2{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.sheet-p{font-size:14px;color:var(--ink-3);font-weight:700;margin-top:4px}
.field{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.input{width:100%;height:54px;padding:0 16px;border-radius:17px;border:2px solid var(--line);background:var(--surface-2);font-size:16.5px;font-weight:800;outline:none;transition:border-color .15s,background .15s}
.input:focus{border-color:var(--focus);background:var(--surface)}
.input::placeholder{color:var(--ink-3);font-weight:700}
.input.bad{border-color:var(--c-red)}
.form-err{margin-top:8px;font-size:13.5px;font-weight:800;color:var(--c-red)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:15px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.opt svg{width:16px;height:16px}
.opt .oe{font-size:18px;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.opt[aria-pressed="true"],.opt[data-on="true"]{border-color:var(--tone,var(--ink));background:color-mix(in oklab,var(--tone,var(--ink)) 13%,var(--surface));color:var(--ink)}
.opt.date-opt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:center}
.diff b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1;color:color-mix(in oklab,var(--dt) 55%,var(--ink))}
.diff span{font-weight:900;font-size:14.5px}
.diff small{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.diff[aria-pressed="true"]{border-color:var(--dt);background:color-mix(in oklab,var(--dt) 15%,var(--surface))}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.catopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:12.5px;line-height:1.2;text-align:center;color:var(--ink-2)}
.catopt .ce{font-size:26px;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.catopt[aria-pressed="true"]{border-color:var(--tone);background:color-mix(in oklab,var(--tone) 14%,var(--surface));color:var(--ink)}
.sugg-row{margin-top:10px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;margin-top:22px;border-radius:19px;background:linear-gradient(120deg,#D42A6A,#DD4F1B);color:#fff;font-weight:900;font-size:17px;box-shadow:0 14px 26px -14px #D42A6A}
.btn-primary:active{transform:scale(.985)}
.btn-danger{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:10px;border-radius:16px;font-weight:800;color:var(--c-red);background:color-mix(in oklab,var(--c-red) 9%,var(--surface))}
.btn-danger.armed{background:var(--c-red);color:#fff}
.btn-danger svg{width:18px;height:18px}
.qtyrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}

/* settings */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border-radius:20px;background:var(--surface-2)}
.mrow + .mrow{margin-top:8px}
.mrow .input{height:46px;background:var(--surface)}
.mrow .avbtn{border-radius:36%}
.swatches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding-left:2px}
.sw-c{width:32px;height:32px;border-radius:11px;background:var(--tone);border:3px solid var(--surface)}
.sw-c[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.rrow2{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:8px}
.rrow2 + .rrow2{margin-top:8px}
.rrow2 .input{height:46px}
.rrow2 .emo-in{text-align:center;font-size:22px;padding:0}
.addrow{display:inline-flex;align-items:center;gap:8px;margin-top:10px;height:44px;padding:0 14px;border-radius:14px;border:2px dashed var(--line);font-weight:800;color:var(--ink-2)}
.addrow svg{width:16px;height:16px}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:70;overflow-y:auto;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate .blobs{position:absolute}
.gate-card{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gate-card .logo-big{width:76px;height:76px;transform:rotate(-8deg);margin-bottom:14px}
.gate-h{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.035em;margin-top:6px}
.gate-p{margin-top:10px;color:var(--ink-2);font-weight:700;font-size:15px;max-width:34ch}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,160px));justify-content:center;gap:14px;margin-top:28px;width:100%}
.whoc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 14px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--font-display);font-weight:800;font-size:19px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.whoc:nth-child(odd) .av{transform:rotate(-5deg)}
.whoc:nth-child(even) .av{transform:rotate(5deg)}
.whoc:hover{transform:translateY(-3px)}
.whoc:active{transform:scale(.96)}
.gate-foot{margin-top:22px;font-size:13px;color:var(--ink-3);font-weight:700;max-width:36ch}
.ob-form{display:flex;gap:8px;width:100%;margin-top:22px}
.btn-sq{width:54px;height:54px;flex:none;border-radius:17px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.btn-sq svg{width:22px;height:22px}
.ob-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;min-height:44px}
.ob-chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 6px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:900}
.ob-chip button{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink-3)}
.ob-chip button svg{width:16px;height:16px}

/* ---------- toast + fx ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;width:min(528px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 8px 8px 14px;border-radius:18px;background:var(--toast-bg);color:var(--toast-fg);font-weight:800;font-size:14.5px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2)}
.toast::before{content:"";width:10px;height:10px;flex:none;border-radius:50%;background:var(--tone)}
.toast span{flex:1;min-width:0}
.toast button{flex:none;height:38px;padding:0 12px;border-radius:12px;font-weight:900;color:var(--toast-act)}
.toast.out{opacity:0;transform:translateY(8px);transition:.22s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.floatpts{position:fixed;z-index:91;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--tone);text-shadow:0 2px 0 var(--surface),0 0 12px var(--surface);animation:floatUp 1s ease-out forwards}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) rotate(6deg) translateY(-2px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}}
.view>section{animation:rise .28s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ---------- standalone additions ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html{background:var(--bg)}
.btn-text.armed{background:var(--c-red);color:#fff}
.invite{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:color-mix(in oklab,var(--c-sun) 16%,var(--surface));border:2px dashed color-mix(in oklab,var(--c-sun) 55%,var(--line))}
.invite .lbl{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.invite .code{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.invite-actions{display:flex;flex-wrap:wrap;gap:8px}
.invite-actions .btn-text{height:42px;background:var(--surface)}
.install-card{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 10px 12px 14px;border-radius:22px;background:color-mix(in oklab,var(--c-sky) 12%,var(--surface));color:var(--ink-2)}
.install-card .ic{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--c-sky);color:#fff}
.install-card .ic svg{width:22px;height:22px}
.install-card p{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.install-card b{color:var(--ink);font-weight:900}
.install-card .ia{display:flex;align-items:center;gap:6px;flex:none}
.install-card .btn-text{background:var(--surface)}
.steps{margin:14px 0 0;padding-left:22px;display:grid;gap:10px;font-weight:700;color:var(--ink-2);font-size:15px}
.steps b{color:var(--ink)}

/* ---------- v3: casa isométrica, apariencia, animaciones ---------- */
:root{
  --iso-ground:#CDEFD5; --iso-ground-2:#AEDFBA; --iso-ground-3:#97D3A6;
  --iso-slab:#FFF8EE; --iso-slab-2:#F0DEC3; --iso-slab-3:#E3CCAC;
  --iso-wall-a:#F8F4FF; --iso-wall-b:#EDE6FF; --iso-wall-top:#FFFFFF; --iso-wall-end:#D9CFF4;
  --iso-floor:#FFFFFF; --iso-win:#CDE7FF; --iso-leaf:#33C285; --iso-leaf-2:#20A56D; --iso-trunk:#B98657;
  --iso-shadow:rgba(29,25,52,.13); --cloud:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --iso-ground:#1B3A2C; --iso-ground-2:#153024; --iso-ground-3:#11281E;
    --iso-slab:#2D2849; --iso-slab-2:#231F3C; --iso-slab-3:#1D1933;
    --iso-wall-a:#2F2A54; --iso-wall-b:#28234A; --iso-wall-top:#3D3769; --iso-wall-end:#1F1B3B;
    --iso-floor:#272243; --iso-win:#33507F; --iso-leaf:#1F9E68; --iso-leaf-2:#178657; --iso-trunk:#7A5A3C;
    --iso-shadow:rgba(0,0,0,.3); --cloud:#3A3560;
  }
}
:root[data-theme="dark"]{
  --iso-ground:#1B3A2C; --iso-ground-2:#153024; --iso-ground-3:#11281E;
  --iso-slab:#2D2849; --iso-slab-2:#231F3C; --iso-slab-3:#1D1933;
  --iso-wall-a:#2F2A54; --iso-wall-b:#28234A; --iso-wall-top:#3D3769; --iso-wall-end:#1F1B3B;
  --iso-floor:#272243; --iso-win:#33507F; --iso-leaf:#1F9E68; --iso-leaf-2:#178657; --iso-trunk:#7A5A3C;
  --iso-shadow:rgba(0,0,0,.3); --cloud:#3A3560;
}

/* Inicio: ilustración arriba + hoja redondeada encima */
.home .hero{position:relative;margin:-64px -16px 0;padding:70px 16px 34px;overflow:hidden;background:linear-gradient(180deg,var(--hero-top,color-mix(in oklab,var(--tone) 24%,var(--bg))) 0%,color-mix(in oklab,var(--tone) 11%,var(--bg)) 58%,color-mix(in oklab,var(--c-sun) 16%,var(--bg)) 100%)}
.home .hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-80px;border-radius:50%;background:color-mix(in oklab,var(--tone) 30%,transparent);filter:blur(60px);opacity:.55;pointer-events:none}
.hero-sub{margin-top:12px;font-size:14.5px;font-weight:700;color:var(--ink-2);max-width:34ch}
.home .hello .nm{text-underline-offset:6px}
body[data-tab="inicio"]:not(.scrolled) .topbar{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
#banner{position:relative;z-index:3}
.home-sheet{position:relative;z-index:2;margin:-30px -16px 0;padding:6px 16px 0;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:0 -16px 30px -24px rgba(29,25,52,.5)}
.home-sheet::before{content:"";display:block;width:42px;height:5px;margin:4px auto 0;border-radius:9px;background:var(--line)}
.home-sheet .bento{margin-top:12px}
.iso-wrap{position:relative;z-index:1;margin:8px -8px 0}
.iso{display:block;width:100%;height:auto;overflow:visible;-webkit-user-select:none;user-select:none}
.iso .g-top{fill:var(--iso-ground)} .iso .g-side{fill:var(--iso-ground-2)} .iso .g-side2{fill:var(--iso-ground-3)}
.iso .s-top{fill:var(--iso-slab)} .iso .s-side{fill:var(--iso-slab-2)} .iso .s-side2{fill:var(--iso-slab-3)}
.iso .w-in-a{fill:var(--iso-wall-a)} .iso .w-in-b{fill:var(--iso-wall-b)} .iso .w-top{fill:var(--iso-wall-top)} .iso .w-end{fill:var(--iso-wall-end)}
.iso .win{fill:var(--iso-win);stroke:var(--iso-wall-top);stroke-width:1.6;stroke-linejoin:round}
.iso .win-x{stroke:var(--iso-wall-top);stroke-width:1.3;fill:none}
.iso .fl{fill:color-mix(in oklab,var(--tone) 22%,var(--iso-floor));stroke:color-mix(in oklab,var(--tone) 22%,var(--iso-floor));stroke-width:1.5;stroke-linejoin:round;transition:fill .2s}
.iso .rug{fill:color-mix(in oklab,var(--tone) 44%,var(--iso-floor));stroke:color-mix(in oklab,var(--tone) 44%,var(--iso-floor));stroke-width:3;stroke-linejoin:round;opacity:.8}
.iso .d-top{fill:var(--iso-wall-top)} .iso .d-side{fill:var(--iso-wall-end)} .iso .d-end{fill:var(--iso-wall-b)}
.iso .e-sh{fill:var(--iso-shadow)}
.iso .emo{font-size:23px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.iso .lbl-bg{fill:var(--surface);opacity:.94}
.iso .lbl{font-family:var(--font-body);font-weight:800;font-size:11px;fill:var(--ink)}
.iso .pin-c{fill:var(--tone)} .iso .late .pin-c{fill:var(--c-red)}
.iso .pin-t{font-family:var(--font-display);font-weight:800;font-size:11px;fill:var(--on-tone)} .iso .late .pin-t{fill:#fff}
.iso .ok-c{fill:var(--c-mint)} .iso .ok-p{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iso .t-trunk{fill:var(--iso-trunk)} .iso .t-leaf{fill:var(--iso-leaf)} .iso .t-leaf2{fill:var(--iso-leaf-2)}
.iso .sun{fill:var(--c-sun);opacity:.85} .iso .cloud{fill:var(--cloud);opacity:.8}
.iso [data-act]{cursor:pointer}
.iso .iso-fl:hover .fl,.iso .iso-fl:active .fl{fill:color-mix(in oklab,var(--tone) 34%,var(--iso-floor))}
.iso .iso-room:focus{outline:none}
.iso .iso-room:focus-visible .lbl-bg{stroke:var(--focus);stroke-width:3;opacity:1}
.iso .iso-room:active .lbl-bg{fill:color-mix(in oklab,var(--tone) 18%,var(--surface))}
.iso .busy .emo{animation:bob 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateY(-3.5px)}}
.hero.enter .iso-room,.hero.enter .iso-emo,.hero.enter .iso-fl{animation:drop .6s cubic-bezier(.2,1.35,.4,1) backwards;animation-delay:calc(var(--i,0) * 70ms + 80ms)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.whole-chip{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:40px;margin:2px auto 0;padding:0 6px 0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:14px;color:var(--ink-2)}
.whole-chip b{min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--c-red);color:#fff;font-family:var(--font-display);font-size:13px}
.whole-chip b.zero{background:var(--c-mint)}
#iWhole{position:absolute;left:16px;bottom:42px;z-index:2}
.iso-plan{display:flex;flex-direction:column;align-items:center;gap:6px}
.iso-plan .iso-wrap{width:100%;margin:0}
.tile-me.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.035)}}

/* Entrada: tarjetas de perfil y código */
.whoc{background:color-mix(in oklab,var(--tone) 11%,var(--surface));animation:popIn .5s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i,0) * 70ms)}
.whoc.cur{box-shadow:0 0 0 3px var(--tone),var(--shadow)}
.whoc small{margin-top:-6px;font-family:var(--font-body);font-size:12px;font-weight:800;color:color-mix(in oklab,var(--tone) 60%,var(--ink))}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.92)}}
.gate-card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}

/* Apariencia */
.look{display:flex;flex-direction:column;gap:2px;padding:6px 14px;border-radius:20px;background:var(--surface-2)}
.look-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.look-row>span{font-weight:800;color:var(--ink-2)}
.look .seg{background:var(--surface)}
.look .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.app,.sheet>*,.gate-card{zoom:var(--zoom,1)}
.brand{min-width:0;white-space:nowrap}
.brand span{overflow:hidden;text-overflow:ellipsis}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ---------- v4: bordes del iPhone, transiciones, revisión ---------- */
/* Barra de menú pegada abajo, con la zona del indicador de inicio adentro */
.tabbar{left:0;right:0;width:auto;transform:none;padding:0 0 max(6px,env(safe-area-inset-bottom,0px));background:color-mix(in oklab,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line);box-shadow:0 -10px 30px -22px rgba(29,25,52,.45)}
.tabbar-in{max-width:560px;margin-inline:auto;height:62px;padding:0 6px;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tab{height:58px}
.tab .ind{position:absolute;inset:5px 10px;border-radius:16px;background:color-mix(in oklab,var(--tone) 13%,transparent);view-transition-name:tabind;z-index:-1}
.tab{isolation:isolate}
.fab{margin-top:-34px;box-shadow:0 12px 24px -8px color-mix(in oklab,var(--c-pink) 70%,transparent),0 0 0 5px var(--surface)}

/* Íconos dentro de botones: tamaño por defecto (arregla el ícono gigante en "Guardar premio") */
:where(button) svg{width:20px;height:20px}
.btn-primary svg{width:22px;height:22px;flex:none}

/* Transición entre secciones */
#view{view-transition-name:view}
.topbar{view-transition-name:topbar}
.tabbar{view-transition-name:tabbar}
::view-transition-group(view){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(view){animation:vtOutL .22s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtInR .42s cubic-bezier(.2,.85,.25,1) both}
html[data-dir="back"]::view-transition-old(view){animation-name:vtOutR}
html[data-dir="back"]::view-transition-new(view){animation-name:vtInL}
::view-transition-group(tabind){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.25,.5,1)}
::view-transition-old(topbar),::view-transition-new(topbar),::view-transition-old(tabbar),::view-transition-new(tabbar){animation-duration:.2s}
@keyframes vtOutL{to{opacity:0;transform:translateX(-26px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(26px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(34px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-34px)}}
html.vt .view>section{animation:none}
html:not(.vt)[data-dir="fwd"] .view>section{animation:vtInR .38s cubic-bezier(.2,.85,.25,1) both}
html:not(.vt)[data-dir="back"] .view>section{animation:vtInL .38s cubic-bezier(.2,.85,.25,1) both}

/* Revisión de tareas */
.sec-h .count{min-width:26px;height:26px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--c-pink);color:#fff;font-family:var(--font-display);font-weight:800;font-size:13.5px}
.sec-p{margin:-4px 2px 10px;font-size:13.5px;font-weight:700;color:var(--ink-3)}
.rv-card{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);border-left:4px solid var(--tone)}
.rv-top,.rv-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.rv-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rv-txt b{font-weight:900;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.rv-txt>span{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.rv-txt q{display:block;margin-top:4px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:700;color:var(--ink-2);quotes:none}
.votes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;border-radius:16px;background:color-mix(in oklab,var(--tone) 11%,var(--surface));color:color-mix(in oklab,var(--tone) 55%,var(--ink));font-weight:800;font-size:12.5px;text-align:center;line-height:1.15;border:2px solid transparent;transition:transform .15s,border-color .15s,background .15s}
.vote .ve{font-size:24px;line-height:1}
.vote:active{transform:scale(.95)}
.vote.big{min-height:78px;font-size:13.5px}
.vote.big .ve{font-size:30px}
.vote[aria-pressed="true"]{border-color:var(--tone);background:color-mix(in oklab,var(--tone) 22%,var(--surface));color:var(--ink)}
.rv-note{margin:-2px 2px 0;font-size:12.5px;font-weight:800;color:var(--ink-3)}
.rv-head{padding:12px;border-radius:20px;background:color-mix(in oklab,var(--tone) 10%,var(--surface-2))}
.rv-state{margin-top:12px;padding:10px 14px;border-radius:16px;font-size:14px;font-weight:800;background:color-mix(in oklab,var(--tone) 14%,var(--surface));color:color-mix(in oklab,var(--tone) 55%,var(--ink))}
.rv-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rv-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface-2)}
.rv-item .rv-txt>span{color:color-mix(in oklab,var(--tone) 60%,var(--ink));font-weight:800;font-size:13.5px}
.input.ta{height:auto;min-height:88px;padding:12px 16px;line-height:1.4;resize:none;font-size:16px;font-family:var(--font-body)}
#iReview .sec-h{margin-top:14px}
#iReview .tasks{margin-bottom:4px}
.pts.pend{opacity:.55}
.pts.lost{opacity:.45;text-decoration:line-through}
.rvf{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 7px 0 3px;border-radius:999px;background:var(--surface-2);font-size:13px}
.rvf i{font-style:normal}
.task.done .task-body{text-align:left}

/* ---------- v5: franja continua, apertura, plano limpio ---------- */
/* Arriba siempre del mismo tono que la franja de iOS (sin línea), con un desvanecido suave hacia el contenido */
.topbar,body[data-tab="inicio"]:not(.scrolled) .topbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;background:linear-gradient(var(--bg),color-mix(in oklab,var(--bg) 0%,transparent));pointer-events:none}
.home .hero{background:linear-gradient(180deg,var(--bg) 0,var(--bg) 66px,color-mix(in oklab,var(--tone) 19%,var(--bg)) 210px,color-mix(in oklab,var(--tone) 10%,var(--bg)) 64%,color-mix(in oklab,var(--c-sun) 13%,var(--bg)) 100%)}
.home .hero::after{top:40px}

/* Pantalla de apertura */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .5s ease,visibility .5s}
.splash::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--c-tangerine) 24%,transparent),transparent 66%);animation:spGlow 1.4s ease-out both}
.splash.out{opacity:0;visibility:hidden}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.splash.out .sp-in{transform:scale(1.07)}
.sp-logo{width:96px;height:96px;transform:rotate(-8deg);filter:drop-shadow(0 14px 20px rgba(229,48,122,.28));animation:spPop .75s cubic-bezier(.2,1.5,.4,1) both}
.sp-name{margin:18px 0 0;font-family:var(--font-display);font-weight:800;font-size:46px;letter-spacing:-.035em;line-height:1;color:var(--ink);animation:spUp .6s .18s cubic-bezier(.2,.9,.3,1) both}
.sp-sub{margin:9px 0 0;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);animation:spUp .6s .3s cubic-bezier(.2,.9,.3,1) both}
.sp-dots{display:flex;gap:6px;margin-top:28px;opacity:0;animation:spFade .3s 1.4s both}
.sp-dots b{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:spDot 1s infinite ease-in-out}
.sp-dots b:nth-child(2){animation-delay:.15s}
.sp-dots b:nth-child(3){animation-delay:.3s}
@keyframes spPop{from{opacity:0;transform:rotate(-30deg) scale(.4)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}}
@keyframes spFade{to{opacity:1}}
@keyframes spDot{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
@keyframes spGlow{from{opacity:0;transform:scale(.55)}}
body.splashing .hero.enter .iso-tile,body.splashing .hero.enter .iso-room{animation-play-state:paused}

/* Plano isométrico limpio */
:root{--tl-top:20%;--tl-r:46%;--tl-f:34%;--tl-base:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tl-top:30%;--tl-r:30%;--tl-f:40%;--tl-base:#08070F}}
:root[data-theme="dark"]{--tl-top:30%;--tl-r:30%;--tl-f:40%;--tl-base:#08070F}
.iso-clean{filter:drop-shadow(0 12px 16px rgba(29,25,52,.10))}

.iso .tl-r{fill:color-mix(in oklab,var(--tone) var(--tl-r),var(--tl-base))}

const weekStartName = () => DAY_NAMES[WEEK_DAY];
const weekEndName = () => DAY_NAMES[(WEEK_DAY + 6) % 7];
const weekStart = d => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() - WEEK_DAY + 7) % 7)); return x; };
const weekIdOf = iso => ymd(weekStart(new Date(iso)));
function currentWeek(offset = 0){ const s = addDays(weekStart(new Date()), offset * 7); return {id: ymd(s), start: s, end: addDays(s, 7)}; }
const fmtShort = new Intl.DateTimeFormat('es-CO', {day:'numeric', month:'short'});
const fmtLong = new Intl.DateTimeFormat('es-CO', {weekday:'long', day:'numeric', month:'long'});
const fmtWd = new Intl.DateTimeFormat('es-CO', {weekday:'long'});
const fmtTime = new Intl.DateTimeFormat('es-CO', {hour:'numeric', minute:'2-digit'});
const short = d => fmtShort.format(d).replace('.', '');
const weekRange = w => `${short(w.start)} – ${short(addDays(w.end, -1))}`;
function countdown(){
  const ms = Math.max(0, currentWeek().end - new Date());
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24), m = Math.floor((ms % 3600000) / 60000);
  if(d >= 1) return `${d} d ${h % 24} h`;
  return h >= 1 ? `${h} h ${m} min` : `${m} min`;
}
function dueInfo(due){
  if(!due) return {bucket:'none', label:null, tone:'gray'};
  const diff = Math.round((parseYmd(due) - today()) / 86400000);
  if(diff < 0) return {bucket:'late', label: diff === -1 ? 'Venció ayer' : `Venció hace ${-diff} días`, tone:'red'};
  if(diff === 0) return {bucket:'today', label:'Hoy', tone:'tangerine'};
  if(diff === 1) return {bucket:'tomorrow', label:'Mañana', tone:'sky'};
  if(parseYmd(due) < currentWeek().end) return {bucket:'week', label: cap(fmtWd.format(parseYmd(due))), tone:'grape'};
  return {bucket:'later', label: short(parseYmd(due)), tone:'gray'};
}
function relTime(iso){
  const d = new Date(iso);
  const diff = Math.round((startOfDay(d) - today()) / 86400000);
  const hm = fmtTime.format(d);
  if(diff === 0) return `hoy, ${hm}`;
  if(diff === -1) return `ayer, ${hm}`;
  return `${fmtWd.format(d)} ${short(d)}`;
}
function dueKeyOf(due){
  if(!due) return 'none';
  const t = today();
  if(due === ymd(t)) return 'today';
  if(due === ymd(addDays(t, 1))) return 'tomorrow';
  if(due === ymd(addDays(currentWeek().end, -1))) return 'week';
  return 'custom';
}
function dueFromKey(k){
  const t = today();
  if(k === 'today') return ymd(t);
  if(k === 'tomorrow') return ymd(addDays(t, 1));
  if(k === 'week') return ymd(addDays(currentWeek().end, -1));
  return null;
}

/* Mercado: "2 leche", "1 kg de arroz", "Huevos x30" */
function parseItem(raw){
  let s = String(raw || '').trim().replace(/\s+/g, ' ');
  let qty = null;
  let m = s.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|kilos?|g|gr|gramos|lb|libras?|l|lt|litros?|ml|und|unidades|paquetes?|bolsas?|docenas?|cajas?|latas?|botellas?)?)\s+(?:de\s+)?(.+)$/i);
  if(m){ qty = m[1].trim(); s = m[2]; }
  else {
    m = s.match(/^(.+?)\s*(?:x\s*(\d+)|\((.+)\))$/i);
    if(m){ s = m[1]; qty = m[2] || m[3]; }
  }
  return {name: cap(s.trim()).slice(0, 60), qty: qty ? String(qty).slice(0, 20) : null};
}
const qtyLabel = q => !q ? '' : (/^\d+([.,]\d+)?$/.test(q) ? '×' + q : q);
function guessCat(name){
  const n = norm(name);
  if(!n) return null;
  const learned = S.catalogMap[slug(name)];
  if(learned && CAT_BY_ID[learned]) return learned;
  const words = ' ' + n.replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  let best = null, bestLen = 0;
  for(const c of CAT_KW){
    for(const kw of c.kws){
      if(kw.length <= bestLen) continue;
      if(words.includes(' ' + kw + ' ') || words.includes(' ' + kw + 's ') || words.includes(' ' + kw + 'es ')){ best = c.id; bestLen = kw.length; }
    }
  }
  return best || 'otros';
}
